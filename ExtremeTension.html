<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06070b">
<title>极限拉扯（软体史莱姆）</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-drag: none;
  }
  html, body {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #06070b;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Helvetica Neue", Helvetica, "Microsoft YaHei", sans-serif;
  }
  /* 背景光晕层（颜色随史莱姆变化） */
  #glow {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
  }
  /* 舞台比屏幕大一圈，屏幕震动时不会露出黑边 */
  #stage {
    position: fixed;
    left: -28px; top: -28px;
    width: calc(100% + 56px);
    height: calc(100% + 56px);
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    z-index: 2;
  }
  #c {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #hint {
    position: fixed;
    left: 12px; top: 10px;
    max-width: 68vw;
    font-size: 11.5px;
    line-height: 1.55;
    letter-spacing: .2px;
    color: rgba(255, 255, 255, 0.38);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="glow"></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hint">【游戏说明：按住史莱姆的任意部位向外用力拉扯，松手看它Q弹回弹。点击背景可换颜色。】</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx    = canvas.getContext('2d');
  var stage  = document.getElementById('stage');
  var glowEl = document.getElementById('glow');

  var TAU = Math.PI * 2;
  var MARGIN = 28;               // 舞台外扩，用于震动时不露边

  var W = 1, H = 1, DPR = 1;
  var cx = 0, cy = 0, baseR = 100;

  var N = 56;                    // 史莱姆边界上的质点数量
  var pts = [];                  // {x,y,vx,vy,rx,ry}
  var L0 = 20;                   // 相邻质点弹簧的静止长度

  /* ---------------- 物理参数 ---------------- */
  var K_NEI   = 560;             // 相邻质点弹簧刚度（维持周长/体积）
  var K_SHAPE = 110;             // 形状记忆刚度（回到圆形）
  var DAMP    = 2.6;             // 全局空气阻尼
  var K_GRAB  = 260;             // 抓取弹簧刚度
  var C_GRAB  = 34;              // 抓取阻尼（接近临界阻尼，跟手不抖）
  var MAXV    = 4200;            // 速度上限（防爆）
  var FIXED   = 1 / 120;         // 固定物理步长

  var AX = new Float32Array(N);
  var AY = new Float32Array(N);

  /* ---------------- 颜色 ---------------- */
  var HUES = [166, 196, 258, 318, 12, 40, 96, 214, 282, 340];
  var hueIdx = 0;
  var cur = { h: 166, s: 88, l: 58 };
  var tgt = { h: 166, s: 88, l: 58 };

  function hsl(h, s, l, a) {
    h = ((h % 360) + 360) % 360;
    if (s < 0) s = 0; if (s > 100) s = 100;
    if (l < 0) l = 0; if (l > 100) l = 100;
    return 'hsla(' + h.toFixed(1) + ',' + s.toFixed(1) + '%,' +
           l.toFixed(1) + '%,' + (a === undefined ? 1 : a) + ')';
  }

  /* ---------------- 初始化 ---------------- */
  function setupPoints() {
    pts.length = 0;
    for (var i = 0; i < N; i++) {
      var a = i / N * TAU;
      var x = cx + Math.cos(a) * baseR;
      var y = cy + Math.sin(a) * baseR;
      pts.push({ x: x, y: y, vx: 0, vy: 0, rx: x, ry: y });
    }
    L0 = 2 * baseR * Math.sin(Math.PI / N);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth  || document.documentElement.clientWidth  || 320;
    H = window.innerHeight || document.documentElement.clientHeight || 480;

    canvas.width  = Math.round((W + MARGIN * 2) * DPR);
    canvas.height = Math.round((H + MARGIN * 2) * DPR);
    canvas.style.width  = (W + MARGIN * 2) + 'px';
    canvas.style.height = (H + MARGIN * 2) + 'px';

    // 绘图坐标系原点对齐到视口左上角
    ctx.setTransform(DPR, 0, 0, DPR, MARGIN * DPR, MARGIN * DPR);

    cx = W / 2;
    cy = H / 2;
    baseR = Math.min(W, H) * 0.19;
    if (baseR < 56) baseR = 56;
    if (baseR > 150) baseR = 150;

    setupPoints();
    dirty = null;        // 画布尺寸变化后已被清空
  }

  /* ---------------- 物理 ---------------- */
  function step(dt) {
    var i, p, q, dx, dy, d, f, j;

    for (i = 0; i < N; i++) { AX[i] = 0; AY[i] = 0; }

    // 1) 相邻质点之间的弹簧（保持周长，拉扯时另一侧会被拉细，像真的果冻）
    for (i = 0; i < N; i++) {
      p = pts[i];
      j = (i + 1) % N;
      q = pts[j];
      dx = q.x - p.x;
      dy = q.y - p.y;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < 0.0001) d = 0.0001;
      f = K_NEI * (d - L0) / d;
      AX[i] += dx * f;  AY[i] += dy * f;
      AX[j] -= dx * f;  AY[j] -= dy * f;
    }

    // 2) 形状记忆：每个质点被轻轻拉回自己的圆形静止位置
    for (i = 0; i < N; i++) {
      p = pts[i];
      AX[i] += K_SHAPE * (p.rx - p.x);
      AY[i] += K_SHAPE * (p.ry - p.y);
    }

    // 3) 手指/鼠标的拉力：以按点为圆心的高斯权重，平滑地"吸"起一片区域
    if (dragging) {
      var sg = baseR * 0.62;
      var inv = 1 / (2 * sg * sg);
      for (i = 0; i < N; i++) {
        p = pts[i];
        dx = pointer.x - p.x;
        dy = pointer.y - p.y;
        var w = Math.exp(-(dx * dx + dy * dy) * inv);
        if (w < 0.008) continue;
        AX[i] += w * (K_GRAB * dx - C_GRAB * p.vx);
        AY[i] += w * (K_GRAB * dy - C_GRAB * p.vy);
      }
    }

    // 4) 半隐式欧拉积分 + 阻尼
    var damp = Math.exp(-DAMP * dt);
    var maxSq = 0;
    for (i = 0; i < N; i++) {
      p = pts[i];
      p.vx = (p.vx + AX[i] * dt) * damp;
      p.vy = (p.vy + AY[i] * dt) * damp;

      var sp2 = p.vx * p.vx + p.vy * p.vy;
      if (sp2 > MAXV * MAXV) {
        var k = MAXV / Math.sqrt(sp2);
        p.vx *= k; p.vy *= k;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      var ex = p.x - p.rx, ey = p.y - p.ry;
      var e2 = ex * ex + ey * ey;
      if (e2 > maxSq) maxSq = e2;
    }
    if (dragging) maxStretch = Math.sqrt(maxSq);
  }

  /* ---------------- 路径：Catmull-Rom 转三次贝塞尔，绝对平滑 ---------------- */
  function tracePath() {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 0; i < N; i++) {
      var p0 = pts[(i - 1 + N) % N];
      var p1 = pts[i];
      var p2 = pts[(i + 1) % N];
      var p3 = pts[(i + 2) % N];
      var c1x = p1.x + (p2.x - p0.x) / 6;
      var c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6;
      var c2y = p2.y - (p3.y - p1.y) / 6;
      ctx.bezierCurveTo(c1x, c1y, c2x, c2y, p2.x, p2.y);
    }
    ctx.closePath();
  }

  /* ---------------- 内部气泡（固定"体坐标"，随形体一起拉伸） ---------------- */
  var BUB = [
    { x: -0.42, y:  0.10, r: 0.085, a: 0.15 },
    { x:  0.20, y: -0.30, r: 0.050, a: 0.12 },
    { x:  0.36, y:  0.32, r: 0.095, a: 0.09 },
    { x: -0.04, y:  0.42, r: 0.048, a: 0.12 }
  ];

  /* ---------------- 绘制 ---------------- */
  var dirty = null;

  function render() {
    if (dirty) {
      ctx.clearRect(dirty.x, dirty.y, dirty.w, dirty.h);
    }

    // 包围盒
    var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    for (var i = 0; i < N; i++) {
      var p = pts[i];
      if (p.x < minx) minx = p.x;
      if (p.x > maxx) maxx = p.x;
      if (p.y < miny) miny = p.y;
      if (p.y > maxy) maxy = p.y;
    }
    if (dragging) {
      if (pointer.x < minx) minx = pointer.x;
      if (pointer.x > maxx) maxx = pointer.x;
      if (pointer.y < miny) miny = pointer.y;
      if (pointer.y > maxy) maxy = pointer.y;
    }
    var pad = 40;
    dirty = { x: minx - pad, y: miny - pad, w: (maxx - minx) + pad * 2, h: (maxy - miny) + pad * 2 };

    var bw = maxx - minx, bh = maxy - miny;
    var ox = minx + bw / 2, oy = miny + bh / 2;
    var rw = bw / 2, rh = bh / 2;
    var r = Math.max(rw, rh);
    if (r < 2) r = 2;

    /* ---- 本体 ---- */
    ctx.save();
    tracePath();
    ctx.clip();

    // 果冻主渐变（左上亮，边缘深，水润感）
    var g = ctx.createRadialGradient(
      ox - rw * 0.38, oy - rh * 0.42, r * 0.04,
      ox, oy + rh * 0.12, r * 1.45
    );
    g.addColorStop(0,    hsl(cur.h - 8, cur.s + 10, cur.l + 30, 1));
    g.addColorStop(0.38, hsl(cur.h, cur.s, cur.l, 1));
    g.addColorStop(0.78, hsl(cur.h + 6, cur.s + 4, cur.l * 0.62, 1));
    g.addColorStop(1,    hsl(cur.h + 10, cur.s + 6, cur.l * 0.38, 1));
    ctx.fillStyle = g;
    ctx.fillRect(minx - 4, miny - 4, bw + 8, bh + 8);

    // 内圈阴影，让边缘有厚度
    tracePath();
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(12, r * 0.22);
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.stroke();

    // 底部反光（透光感）
    var g2 = ctx.createRadialGradient(
      ox + rw * 0.05, oy + rh * 0.80, r * 0.02,
      ox, oy + rh * 0.62, r * 0.95
    );
    g2.addColorStop(0, hsl(cur.h - 24, 100, 78, 0.30));
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(minx - 4, miny - 4, bw + 8, bh + 8);

    // 内部小气泡
    var br = Math.min(rw, rh);
    for (i = 0; i < BUB.length; i++) {
      var b = BUB[i];
      var bx = ox + b.x * rw;
      var by = oy + b.y * rh;
      var rad = Math.max(1.5, b.r * br);
      var bg = ctx.createRadialGradient(bx - rad * 0.3, by - rad * 0.3, rad * 0.08, bx, by, rad);
      bg.addColorStop(0, 'rgba(255,255,255,' + (b.a * 1.7) + ')');
      bg.addColorStop(0.7, 'rgba(255,255,255,' + (b.a * 0.45) + ')');
      bg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(bx, by, rad, 0, TAU);
      ctx.fill();
    }

    // 大高光（椭圆柔光）
    ctx.save();
    ctx.translate(ox - rw * 0.36, oy - rh * 0.44);
    ctx.scale(1, 0.74);
    var hr = r * 0.66;
    var hg = ctx.createRadialGradient(0, 0, 0, 0, 0, hr);
    hg.addColorStop(0,    'rgba(255,255,255,0.72)');
    hg.addColorStop(0.32, 'rgba(255,255,255,0.28)');
    hg.addColorStop(0.62, 'rgba(255,255,255,0.07)');
    hg.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(0, 0, hr, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 小亮点（水润反光点）
    var sx = ox - rw * 0.50, sy = oy - rh * 0.56;
    var sg2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 0.15);
    sg2.addColorStop(0, 'rgba(255,255,255,0.95)');
    sg2.addColorStop(0.45, 'rgba(255,255,255,0.35)');
    sg2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg2;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 0.15, 0, TAU);
    ctx.fill();

    ctx.restore(); // 取消裁剪

    // 外圈描边（上亮下柔）
    tracePath();
    var rg = ctx.createLinearGradient(0, miny, 0, maxy);
    rg.addColorStop(0,    hsl(cur.h - 10, 100, 90, 0.55));
    rg.addColorStop(0.45, hsl(cur.h, 100, 85, 0.10));
    rg.addColorStop(1,    hsl(cur.h + 10, 100, 80, 0.30));
    ctx.lineWidth = Math.max(1.4, r * 0.02);
    ctx.strokeStyle = rg;
    ctx.stroke();

    /* ---- 按住时的小圆环指示 ---- */
    if (dragging) {
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 13, 0, TAU);
      ctx.strokeStyle = 'rgba(255,255,255,0.30)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 3.2, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fill();
    }
  }

  /* ---------------- 屏幕震动（修改 CSS transform） ---------------- */
  var shakeAmp = 0, shakeT = 0, shakeOn = false;

  function updateShake(dt) {
    if (shakeAmp <= 0) {
      if (shakeOn) {
        stage.style.transform = 'translate3d(0,0,0)';
        shakeOn = false;
      }
      return;
    }
    shakeT += dt;
    var decay = Math.exp(-shakeT * 11);
    var a = shakeAmp * decay;
    if (a < 0.07) {
      shakeAmp = 0;
      stage.style.transform = 'translate3d(0,0,0)';
      shakeOn = false;
      return;
    }
    var x = Math.sin(shakeT * 62) * a;
    var y = Math.sin(shakeT * 47 + 1.3) * a * 0.9;
    var rot = Math.sin(shakeT * 53 + 2.1) * a * 0.05;
    stage.style.transform =
      'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + rot.toFixed(3) + 'deg)';
    shakeOn = true;
  }

  /* ---------------- 颜色渐变过渡 ---------------- */
  function updateColor(dt) {
    var k = 1 - Math.exp(-dt * 10);
    var dh = ((tgt.h - cur.h + 540) % 360) - 180;
    cur.h = ((cur.h + dh * k) % 360 + 360) % 360;
    cur.s += (tgt.s - cur.s) * k;
    cur.l += (tgt.l - cur.l) * k;
  }

  function updateGlow() {
    var c1 = hsl(tgt.h, tgt.s, tgt.l, 0.16);
    var c2 = hsl(tgt.h, tgt.s, tgt.l, 0.05);
    glowEl.style.background =
      'radial-gradient(circle at 50% 50%, ' + c1 + ' 0%, ' + c2 + ' 45%, rgba(0,0,0,0) 75%)';
  }

  function changeColor() {
    var idx = hueIdx;
    if (HUES.length > 1) {
      while (idx === hueIdx) idx = (Math.random() * HUES.length) | 0;
    }
    hueIdx = idx;
    tgt.h = HUES[idx] + (Math.random() * 12 - 6);
    tgt.s = 82 + Math.random() * 14;
    tgt.l = 55 + Math.random() * 9;
    updateGlow();
  }

  /* ---------------- 交互 ---------------- */
  var dragging = false;
  var pointer = { x: 0, y: 0 };
  var maxStretch = 0;
  var activeId = null;

  function isInside(x, y) {
    var c = false;
    for (var i = 0, j = N - 1; i < N; j = i++) {
      var xi = pts[i].x, yi = pts[i].y;
      var xj = pts[j].x, yj = pts[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
    }
    return c;
  }

  function nearEdge(x, y) {
    var best = 1e9;
    for (var i = 0; i < N; i++) {
      var dx = pts[i].x - x, dy = pts[i].y - y;
      var d2 = dx * dx + dy * dy;
      if (d2 < best) best = d2;
    }
    return best < 22 * 22;
  }

  function onDown(x, y) {
    pointer.x = x;
    pointer.y = y;
    if (isInside(x, y) || nearEdge(x, y)) {
      dragging = true;
      maxStretch = 0;
      canvas.style.cursor = 'grabbing';
    } else {
      changeColor();
    }
  }

  function onMove(x, y) {
    pointer.x = x;
    pointer.y = y;
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    canvas.style.cursor = 'grab';
    if (maxStretch > 3) {
      shakeAmp = Math.min(5.2, 0.9 + maxStretch * 0.014);
      shakeT = 0;
    }
    maxStretch = 0;
  }

  /* --- 优先使用 Pointer Events（iOS 13+/微信/桌面 全覆盖） --- */
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', function (e) {
      if (activeId !== null) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      activeId = e.pointerId;
      try { if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId); } catch (err) {}
      onDown(e.clientX, e.clientY);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    window.addEventListener('pointermove', function (e) {
      if (e.pointerId !== activeId) return;
      onMove(e.clientX, e.clientY);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    window.addEventListener('pointerup', function (e) {
      if (e.pointerId !== activeId) return;
      activeId = null;
      onUp();
    }, { passive: false });

    window.addEventListener('pointercancel', function (e) {
      if (e.pointerId !== activeId) return;
      activeId = null;
      onUp();
    }, { passive: false });

  } else {
    /* --- 兜底：老浏览器用 touch / mouse --- */
    canvas.addEventListener('touchstart', function (e) {
      if (activeId !== null) return;
      var t = e.changedTouches[0];
      if (!t) return;
      activeId = t.identifier;
      onDown(t.clientX, t.clientY);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', function (e) {
      var list = e.changedTouches;
      for (var i = 0; i < list.length; i++) {
        if (list[i].identifier === activeId) onMove(list[i].clientX, list[i].clientY);
      }
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    function touchEnd(e) {
      var list = e.changedTouches;
      for (var i = 0; i < list.length; i++) {
        if (list[i].identifier === activeId) {
          activeId = null;
          onUp();
        }
      }
    }
    window.addEventListener('touchend', touchEnd, { passive: false });
    window.addEventListener('touchcancel', touchEnd, { passive: false });

    canvas.addEventListener('mousedown', function (e) {
      if (e.button !== 0 || activeId !== null) return;
      activeId = 'mouse';
      onDown(e.clientX, e.clientY);
      e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (activeId !== 'mouse') return;
      onMove(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', function () {
      if (activeId !== 'mouse') return;
      activeId = null;
      onUp();
    });
  }

  // 窗口失焦时安全松开
  window.addEventListener('blur', function () {
    activeId = null;
    onUp();
  });

  // 彻底禁止页面滚动 / 下拉刷新 / 双指缩放
  document.addEventListener('touchmove', function (e) {
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); return false; });

  /* ---------------- 主循环 ---------------- */
  var lastT = 0, acc = 0;

  function frame(ts) {
    requestAnimationFrame(frame);

    if (!lastT) lastT = ts;
    var dt = (ts - lastT) / 1000;
    lastT = ts;
    if (dt < 0) dt = 0;
    if (dt > 0.08) dt = 0.08;

    acc += dt;
    var guard = 0;
    while (acc >= FIXED && guard < 10) {
      step(FIXED);
      acc -= FIXED;
      guard++;
    }
    if (guard >= 10) acc = 0;

    updateColor(dt);
    updateShake(dt);
    render();
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    resize();
    updateGlow();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize, false);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 120);
  }, false);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { lastT = 0; acc = 0; }
  }, false);

  boot();
})();
</script>
</body>
</html>
