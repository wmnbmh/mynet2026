<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<title>我的游戏库</title>
<style>
  :root{
    --bg:#05070e;
    --cyan:#00f0ff;
    --violet:#a78bfa;
    --text:#e7f2ff;
    --muted:#7c8db5;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overflow-x:hidden;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:calc(var(--safe-top) + 44px);
    padding-bottom:calc(var(--safe-bottom) + 48px);
    padding-left:24px;
    padding-right:24px;
    min-height:100vh;
    min-height:100svh;
    overflow-x:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  body.modal-open{overflow:hidden;}

  /* 科技网格背景 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    pointer-events:none;
    z-index:0;
  }

  /* 光晕 */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:0;
    animation:float 14s ease-in-out infinite;
  }
  .orb-1{
    width:520px;height:520px;max-width:90vw;max-height:90vw;
    background:rgba(0,240,255,.16);
    top:-140px;left:-120px;
  }
  .orb-2{
    width:460px;height:460px;max-width:80vw;max-height:80vw;
    background:rgba(139,92,246,.18);
    bottom:-160px;right:-100px;
    animation-delay:-7s;
  }
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(24px,-28px,0) scale(1.08);}
  }

  /* 内容外壳：auto 外边距居中，内容超高时自动归零，不被裁切 */
  .shell{
    position:relative;
    z-index:1;
    margin:auto 0;
    width:100%;
    max-width:1180px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* 顶部栏 */
  .topbar{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }

  .status{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.22em;
    color:var(--muted);
    text-transform:uppercase;
    flex-wrap:wrap;
  }
  .dot{
    flex:0 0 auto;
    width:7px;height:7px;
    border-radius:50%;
    background:#22ffa7;
    box-shadow:0 0 10px #22ffa7,0 0 22px rgba(34,255,167,.55);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.35;}}

  /* 新建游戏按钮 */
  .btn-new{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    letter-spacing:.06em;
    color:#04121a;
    border:none;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(135deg,#a9f8ff,#00d5ff 45%,#3aa9ff);
    box-shadow:0 10px 26px -12px rgba(0,213,255,.95),inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .25s,box-shadow .25s,filter .25s;
    white-space:nowrap;
  }
  .btn-new:hover{
    transform:translateY(-2px);
    filter:brightness(1.06);
    box-shadow:0 16px 34px -14px rgba(0,213,255,1),inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-new:active{transform:translateY(0) scale(.98);}

  /* 标题 */
  h1{
    font-size:clamp(2.2rem,7vw,4.4rem);
    font-weight:800;
    letter-spacing:.06em;
    line-height:1.1;
    text-align:center;
    background:linear-gradient(180deg,#ffffff 8%,#8ef4ff 55%,#3aa9ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 5px rgba(0,240,255,.45));
    animation:titleIn .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateY(18px);filter:blur(2px);}
    to{opacity:1;transform:none;}
  }

  .subtitle{
    margin-top:16px;
    font-size:14px;
    letter-spacing:.18em;
    color:var(--muted);
    text-align:center;
    animation:titleIn 1s .12s cubic-bezier(.22,1,.36,1) both;
  }

  .divider{
    width:min(560px,80%);
    height:1px;
    margin:34px 0 40px;
    position:relative;
    background:linear-gradient(90deg,transparent,rgba(0,240,255,.55),transparent);
  }
  .divider::after{
    content:"";
    position:absolute;
    left:50%;top:50%;
    width:6px;height:6px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);
  }

  /* 卡片容器 */
  .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:stretch;
    gap:24px;
    width:100%;
  }

  /* 卡片插槽（承载卡片 + 删除按钮） */
  .card-slot{
    position:relative;
    display:flex;
    flex:1 1 300px;
    max-width:360px;
    min-width:0;
  }

  /* 游戏卡片 */
  .game-card{
    --accent:var(--cyan);
    --accent-soft:rgba(0,240,255,.20);
    --accent-glow:rgba(0,240,255,.38);

    position:relative;
    flex:1 1 auto;
    width:100%;
    max-width:none;
    min-width:0;
    min-height:232px;
    padding:26px 28px 24px;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--text);
    background:linear-gradient(155deg,rgba(19,27,46,.92),rgba(8,12,22,.94));
    border:1px solid var(--accent-soft);
    box-shadow:
      0 22px 48px -22px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    transition:transform .4s cubic-bezier(.22,1,.36,1),
               border-color .4s, box-shadow .4s;
    animation:cardIn .7s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px) scale(.97);}
    to{opacity:1;transform:none;}
  }

  /* 强调色循环 */
  .game-card.violet{
    --accent:var(--violet);
    --accent-soft:rgba(167,139,250,.24);
    --accent-glow:rgba(139,92,246,.42);
  }
  .game-card.magenta{
    --accent:#ff5ec8;
    --accent-soft:rgba(255,94,200,.22);
    --accent-glow:rgba(255,94,200,.40);
  }
  .game-card.amber{
    --accent:#ffb545;
    --accent-soft:rgba(255,181,69,.22);
    --accent-glow:rgba(255,164,32,.40);
  }
  .game-card.indigo{
    --accent:#7aa2ff;
    --accent-soft:rgba(122,162,255,.24);
    --accent-glow:rgba(90,120,255,.42);
  }

  /* 扫光 */
  .game-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.10) 50%,transparent 68%);
    transform:translateX(-120%);
    transition:transform .75s ease;
    pointer-events:none;
  }
  .game-card:hover::before{transform:translateX(120%);}

  /* 四角装饰 */
  .game-card::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:10px;
    border:1px solid transparent;
    background:
      linear-gradient(var(--accent),var(--accent)) top left/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) top left/1px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/1px 14px no-repeat;
    opacity:.55;
    pointer-events:none;
    transition:opacity .4s;
  }
  .game-card:hover::after{opacity:1;}

  .game-card:hover{
    transform:translateY(-8px);
    border-color:var(--accent);
    box-shadow:
      0 30px 60px -26px var(--accent-glow),
      0 0 0 1px var(--accent-soft),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .game-card:active{transform:translateY(-2px) scale(.99);}

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:22px;
  }
  .idx{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--accent);
    opacity:.9;
  }
  .tag{
    flex:0 0 auto;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:10.5px;
    letter-spacing:.2em;
    padding:4px 10px;
    border-radius:999px;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:rgba(255,255,255,.02);
  }

  .game-card h2{
    font-size:clamp(1.4rem,2.6vw,1.75rem);
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:12px;
    overflow-wrap:anywhere;
    transition:text-shadow .4s;
  }
  .game-card:hover h2{
    text-shadow:0 0 24px var(--accent-glow);
  }

  .desc{
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
    letter-spacing:.05em;
    overflow-wrap:anywhere;
  }

  .play{
    margin-top:auto;
    padding-top:22px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.2em;
    color:var(--accent);
    opacity:.75;
    transition:opacity .4s,gap .4s;
  }
  .game-card:hover .play{opacity:1;gap:14px;}

  .play svg{
    width:14px;height:14px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* 删除自定义游戏 */
  .del-btn{
    position:absolute;
    top:-9px;right:-9px;
    z-index:3;
    width:27px;height:27px;
    display:grid;
    place-items:center;
    border-radius:50%;
    cursor:pointer;
    font-size:12px;
    line-height:1;
    color:#ff8098;
    background:rgba(28,10,18,.9);
    border:1px solid rgba(255,90,120,.5);
    box-shadow:0 6px 16px -8px rgba(255,60,100,.9);
    opacity:0;
    transform:scale(.85);
    transition:opacity .25s,transform .25s,background .25s;
  }
  .card-slot:hover .del-btn,
  .card-slot:focus-within .del-btn{opacity:1;transform:scale(1);}
  .del-btn:hover{background:rgba(255,60,100,.28);}
  @media (hover:none){ .del-btn{opacity:1;transform:scale(1);} }

  /* 骨架屏 */
  .skeleton{
    flex:1 1 300px;
    max-width:360px;
    min-height:232px;
    border-radius:18px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(155deg,rgba(19,27,46,.75),rgba(8,12,22,.85));
    border:1px solid rgba(0,240,255,.12);
  }
  .skeleton::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(0,240,255,.09) 50%,transparent 70%);
    animation:shimmer 1.5s linear infinite;
  }
  @keyframes shimmer{
    from{transform:translateX(-100%);}
    to{transform:translateX(100%);}
  }

  /* 状态提示（错误 / 空） */
  .state{
    flex:1 1 100%;
    width:100%;
    text-align:center;
    padding:34px 24px;
    border-radius:18px;
    background:linear-gradient(155deg,rgba(19,27,46,.7),rgba(8,12,22,.8));
    border:1px dashed rgba(0,240,255,.22);
  }
  .state-icon{
    width:44px;height:44px;
    margin:0 auto 16px;
    display:grid;
    place-items:center;
    border-radius:50%;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:20px;
    font-weight:700;
    color:#ff8fa8;
    border:1px solid rgba(255,90,120,.45);
    background:rgba(255,60,100,.1);
    box-shadow:0 0 26px -8px rgba(255,60,100,.8);
  }
  .state h3{
    font-size:1.05rem;
    letter-spacing:.06em;
    margin-bottom:10px;
  }
  .state p{
    font-size:13px;
    line-height:1.7;
    color:var(--muted);
    max-width:520px;
    margin:0 auto;
    overflow-wrap:anywhere;
  }
  .state .hint{
    margin-top:8px;
    font-size:12px;
    color:rgba(124,141,181,.75);
  }
  .btn-retry{
    margin-top:20px;
    padding:10px 22px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.16em;
    color:var(--cyan);
    background:rgba(0,240,255,.08);
    border:1px solid rgba(0,240,255,.45);
    border-radius:999px;
    cursor:pointer;
    transition:background .25s,box-shadow .25s;
  }
  .btn-retry:hover{
    background:rgba(0,240,255,.18);
    box-shadow:0 0 22px -6px rgba(0,240,255,.9);
  }

  footer{
    margin-top:52px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:rgba(124,141,181,.6);
    text-align:center;
  }

  /* ========== 弹窗 ========== */
  .modal-mask{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(2,5,12,.74);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    opacity:0;
    visibility:hidden;
    transition:opacity .28s ease,visibility .28s;
  }
  .modal-mask.show{opacity:1;visibility:visible;}

  .modal{
    width:min(420px,100%);
    max-height:calc(100svh - 40px);
    overflow-y:auto;
    padding:28px 26px 24px;
    border-radius:18px;
    background:linear-gradient(155deg,rgba(22,31,52,.98),rgba(9,13,24,.99));
    border:1px solid rgba(0,240,255,.28);
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.95),
      0 0 0 1px rgba(0,240,255,.08),
      0 0 60px -30px rgba(0,240,255,.7);
    transform:translateY(14px) scale(.97);
    transition:transform .28s cubic-bezier(.22,1,.36,1);
  }
  .modal-mask.show .modal{transform:none;}

  .modal h3{
    font-size:1.15rem;
    letter-spacing:.06em;
    margin-bottom:6px;
    background:linear-gradient(180deg,#fff,#8ef4ff);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .modal-tip{
    font-size:12px;
    line-height:1.7;
    color:var(--muted);
    margin-bottom:20px;
  }

  .field{display:block;margin-bottom:16px;}
  .field span{
    display:block;
    margin-bottom:7px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    font-family:inherit;
    font-size:16px;      /* 16px 防止 iOS 自动放大 */
    color:var(--text);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(0,240,255,.22);
    border-radius:10px;
    outline:none;
    transition:border-color .25s,box-shadow .25s,background .25s;
    -webkit-appearance:none;
    appearance:none;
  }
  .field input::placeholder{color:rgba(124,141,181,.6);}
  .field input:focus{
    border-color:rgba(0,240,255,.75);
    background:rgba(0,240,255,.05);
    box-shadow:0 0 0 3px rgba(0,240,255,.12);
  }

  .modal-err{
    min-height:18px;
    margin-bottom:12px;
    font-size:12px;
    color:#ff8fa8;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .modal-actions button{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    letter-spacing:.06em;
    padding:11px 22px;
    border-radius:10px;
    cursor:pointer;
    transition:transform .2s,filter .2s,background .2s;
  }
  .btn-ghost{
    color:var(--muted);
    background:transparent;
    border:1px solid rgba(124,141,181,.4);
  }
  .btn-ghost:hover{color:var(--text);border-color:rgba(124,141,181,.8);}
  .btn-primary{
    color:#04121a;
    border:none;
    background:linear-gradient(135deg,#a9f8ff,#00d5ff 45%,#3aa9ff);
    box-shadow:0 10px 26px -12px rgba(0,213,255,.95);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .modal-actions button:active{transform:scale(.97);}

  /* ============ 响应式 ============ */

  @media (max-width:1024px){
    .card-slot{flex:1 1 280px;max-width:420px;}
    .skeleton{flex:1 1 280px;max-width:420px;}
  }

  @media (max-width:860px){
    .grid{gap:20px;}
    .card-slot{flex:1 1 260px;max-width:340px;}
    .skeleton{flex:1 1 260px;max-width:340px;min-height:220px;}
    .game-card{min-height:220px;padding:24px 24px 22px;}
  }

  /* 手机单列 */
  @media (max-width:720px){
    body{
      padding-top:calc(var(--safe-top) + 28px);
      padding-bottom:calc(var(--safe-bottom) + 36px);
      padding-left:18px;
      padding-right:18px;
      justify-content:flex-start;
    }
    .shell{margin:0;}

    .topbar{
      margin-bottom:18px;
      gap:10px;
      align-items:flex-start;
    }
    .status{
      font-size:10px;
      letter-spacing:.14em;
      gap:7px;
      padding-top:8px;
    }
    .btn-new{
      font-size:12.5px;
      padding:9px 15px;
      letter-spacing:.04em;
    }

    h1{font-size:clamp(1.95rem,9vw,2.6rem);}
    .subtitle{
      margin-top:12px;
      font-size:12.5px;
      letter-spacing:.1em;
      line-height:1.6;
      padding:0 4px;
    }

    .divider{margin:22px 0 26px;width:min(100%,420px);}

    .grid{
      flex-direction:column;
      flex-wrap:nowrap;
      align-items:stretch;
      gap:16px;
    }

    .card-slot{
      flex:0 0 auto;
      width:100%;
      max-width:none;
    }
    .skeleton{
      flex:0 0 auto;
      width:100%;
      max-width:none;
      min-height:170px;
    }

    .game-card{
      min-height:0;           /* 高度完全由内容决定，杜绝裁切 */
      padding:22px 20px 20px;
      border-radius:16px;
    }

    .card-top{margin-bottom:16px;}
    .game-card h2{font-size:1.35rem;margin-bottom:8px;}
    .desc{font-size:13px;line-height:1.65;}
    .play{padding-top:18px;font-size:11.5px;letter-spacing:.18em;}

    .del-btn{top:-8px;right:-8px;width:28px;height:28px;}

    .state{padding:28px 18px;}
    .state p{font-size:12.5px;}

    footer{
      margin-top:34px;
      font-size:10.5px;
      letter-spacing:.12em;
      padding-bottom:4px;
    }

    .modal{padding:24px 20px 20px;border-radius:16px;}
    .modal-actions{flex-direction:column-reverse;}
    .modal-actions button{width:100%;}
  }

  /* 超窄屏 */
  @media (max-width:380px){
    body{padding-left:14px;padding-right:14px;}
    h1{font-size:1.8rem;}
    .game-card{padding:20px 16px 18px;}
    .tag{font-size:9.5px;padding:3px 8px;letter-spacing:.14em;}
    .desc{font-size:12.5px;}
    .btn-new{font-size:12px;padding:8px 13px;}
  }

  /* 横屏矮屏 */
  @media (max-height:520px) and (orientation:landscape){
    body{padding-top:calc(var(--safe-top) + 20px);padding-bottom:calc(var(--safe-bottom) + 20px);}
    .shell{margin:0 auto;}
    h1{font-size:clamp(1.6rem,5vw,2.2rem);}
    .subtitle{display:none;}
    .divider{margin:16px 0 20px;}
    .game-card{min-height:0;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="shell">

    <div class="topbar">
      <div class="status">
        <span class="dot"></span>
        SYSTEM ONLINE&nbsp;//&nbsp;GAME LIBRARY
      </div>
      <button class="btn-new" id="btnNew" type="button">＋ 新建游戏</button>
    </div>

    <h1>我的游戏库</h1>
    <p class="subtitle" id="subtitle">正在扫描仓库…</p>

    <div class="divider"></div>

    <main class="grid" id="grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>

    <footer>// AUTO SYNCED FROM GITHUB</footer>

  </div>

  <!-- 新建游戏弹窗 -->
  <div class="modal-mask" id="mask" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">新建游戏</h3>
      <p class="modal-tip">游戏保存在本机浏览器里。链接可以直接填 <b>xxx.html</b>（同目录文件），也可以填完整网址。</p>

      <label class="field">
        <span>游戏名称</span>
        <input id="inName" type="text" maxlength="40" placeholder="例如：极限拉扯" autocomplete="off" enterkeyhint="next">
      </label>

      <label class="field">
        <span>游戏链接</span>
        <input id="inUrl" type="text" maxlength="500" placeholder="例如：ExtremeTension.html" autocomplete="off" enterkeyhint="done">
      </label>

      <p class="modal-err" id="modalErr"></p>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btnCancel">取消</button>
        <button type="button" class="btn-primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <noscript>
    <p style="position:relative;z-index:2;color:#7c8db5;text-align:center;margin-top:20px;">
      当前浏览器禁用了 JavaScript，无法自动扫描游戏列表。
    </p>
  </noscript>

<script>
(function(){
  'use strict';

  /* ====== 配置 ====== */
  var API_URL = 'https://api.github.com/repos/wmnmhm/mynet2026/contents/';
  var LS_KEY  = 'gamehub:customGames:v1';
  var ACCENTS = ['', 'violet', 'magenta', 'amber', 'indigo'];

  var grid     = document.getElementById('grid');
  var subtitle = document.getElementById('subtitle');
  var mask     = document.getElementById('mask');
  var inName   = document.getElementById('inName');
  var inUrl    = document.getElementById('inUrl');
  var modalErr = document.getElementById('modalErr');

  var repoGames = [];   // 来自 GitHub 的游戏
  var repoError = '';   // 仓库扫描失败原因

  /* ====== 工具 ====== */
  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function getCustom(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(arr)) return [];
      return arr.filter(function(g){
        return g && typeof g.name === 'string' && typeof g.url === 'string' && g.name && g.url;
      });
    }catch(e){
      return [];
    }
  }

  function setCustom(list){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(list));
    }catch(e){
      /* 隐私模式或空间不足：静默失败，不影响当前渲染 */
    }
  }

  function isAbsolute(url){
    return /^(https?:)?\/\//i.test(url) || /^(mailto|tel):/i.test(url);
  }

  /* ====== 渲染 ====== */
  function cardHTML(game, index, customIndex){
    var accent = ACCENTS[index % ACCENTS.length];
    var num    = String(index + 1);
    if(num.length < 2) num = '0' + num;

    var isCustom = game.source === 'custom';
    var href     = esc(game.url);
    var delay    = (0.18 + Math.min(index, 8) * 0.07).toFixed(2);
    var target   = isAbsolute(game.url) ? ' target="_blank" rel="noopener"' : ' target="_blank" rel="noopener"';

    return '' +
      '<div class="card-slot">' +
        '<a class="game-card ' + accent + '" href="' + href + '"' + target +
          ' style="animation-delay:' + delay + 's">' +
          '<div class="card-top">' +
            '<span class="idx">' + num + '</span>' +
            '<span class="tag">' + (isCustom ? 'CUSTOM' : 'HTML') + '</span>' +
          '</div>' +
          '<h2>' + esc(game.name) + '</h2>' +
          '<p class="desc">' + esc(game.desc) + '</p>' +
          '<span class="play">START' +
            '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
          '</span>' +
        '</a>' +
        (isCustom
          ? '<button type="button" class="del-btn" data-del="' + customIndex +
            '" aria-label="删除 ' + esc(game.name) + '" title="删除">✕</button>'
          : '') +
      '</div>';
  }

  function render(){
    var custom = getCustom().map(function(g){
      return { name: g.name, url: g.url, desc: '自定义游戏 · 本机保存', source: 'custom' };
    });

    var total = repoGames.length + custom.length;

    if(repoError && !total){
      subtitle.textContent = '仓库扫描失败 · 可先手动添加游戏';
    }else if(total){
      subtitle.textContent = '已加载 ' + total + ' 款游戏 · 选择你的战场';
    }else{
      subtitle.textContent = '暂无游戏 · 点右上角新建一个';
    }

    var html = '';

    if(repoError){
      html +=
        '<div class="state">' +
          '<div class="state-icon">!</div>' +
          '<h3>游戏列表加载失败</h3>' +
          '<p>' + esc(repoError) + '</p>' +
          '<p class="hint">你手动添加的游戏仍然可以正常使用。</p>' +
          '<button type="button" class="btn-retry" id="btnRetry">重新加载</button>' +
        '</div>';
    }

    repoGames.forEach(function(g, i){
      html += cardHTML(g, i, -1);
    });

    custom.forEach(function(g, i){
      html += cardHTML(g, repoGames.length + i, i);
    });

    if(!repoError && !total){
      html +=
        '<div class="state">' +
          '<div class="state-icon" style="color:#8ef4ff;border-color:rgba(0,240,255,.45);background:rgba(0,240,255,.08);box-shadow:0 0 26px -8px rgba(0,240,255,.8);">+</div>' +
          '<h3>仓库里还没有游戏</h3>' +
          '<p>把任意 .html 文件推到仓库根目录，刷新页面就会自动出现卡片；也可以点右上角「新建游戏」先加一个。</p>' +
        '</div>';
    }

    grid.innerHTML = html;
  }

  /* ====== 拉取仓库文件 ====== */
  function loadRepo(){
    repoError = '';
    grid.innerHTML =
      '<div class="skeleton"></div><div class="skeleton"></div>' +
      '<div class="skeleton"></div><div class="skeleton"></div>';

    fetch(API_URL, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(function(res){
        if(res.status === 403 || res.status === 429){
          throw new Error('接口访问次数已达上限（GitHub 未登录时每小时 60 次），请稍后重试。');
        }
        if(res.status === 404){
          throw new Error('仓库或目录不存在，请确认仓库名与分支是否正确。');
        }
        if(!res.ok){
          throw new Error('服务器返回异常（HTTP ' + res.status + '），请稍后重试。');
        }
        return res.json();
      })
      .then(function(data){
        if(!Array.isArray(data)){
          throw new Error('返回数据格式异常，无法解析游戏列表。');
        }

        repoGames = data
          .filter(function(item){
            return item && item.type === 'file' &&
                   /\.html?$/i.test(item.name) &&
                   item.name.toLowerCase() !== 'index.html';
          })
          .map(function(item){
            return {
              name: item.name.replace(/\.html?$/i, ''),
              url : item.name,                      /* 同目录相对链接 */
              desc: '点击进入 · ' + item.name,
              source: 'repo'
            };
          })
          .sort(function(a, b){
            return a.name.localeCompare(b.name, 'zh-Hans-CN');
          });

        render();
      })
      .catch(function(err){
        repoGames = [];
        if(err instanceof TypeError){
          /* fetch 本身失败：断网、被拦截、CORS 等 */
          repoError = '网络请求失败，可能是网络不通或被浏览器插件拦截，请检查后重试。';
        }else{
          repoError = (err && err.message) ? err.message : '加载失败，请稍后重试。';
        }
        render();
      });
  }

  /* ====== 弹窗 ====== */
  function openModal(){
    inName.value = '';
    inUrl.value  = '';
    modalErr.textContent = '';
    mask.classList.add('show');
    mask.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    setTimeout(function(){ inName.focus(); }, 80);
  }

  function closeModal(){
    mask.classList.remove('show');
    mask.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
  }

  function saveGame(){
    var name = inName.value.trim();
    var url  = inUrl.value.trim();

    if(!name){
      modalErr.textContent = '请填写游戏名称';
      inName.focus();
      return;
    }
    if(!url){
      modalErr.textContent = '请填写游戏链接';
      inUrl.focus();
      return;
    }
    if(/^\s*(javascript|data|vbscript):/i.test(url)){
      modalErr.textContent = '链接格式不支持，请填写普通网址或文件名';
      inUrl.focus();
      return;
    }

    var list = getCustom();
    var dup = list.some(function(g){
      return g.name.toLowerCase() === name.toLowerCase() && g.url === url;
    });
    if(dup){
      modalErr.textContent = '已经存在同名同链接的游戏了';
      return;
    }

    list.push({ name: name.slice(0, 40), url: url });
    setCustom(list);
    closeModal();
    render();
  }

  /* ====== 事件绑定 ====== */
  document.getElementById('btnNew').addEventListener('click', openModal);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('btnSave').addEventListener('click', saveGame);

  mask.addEventListener('click', function(e){
    if(e.target === mask) closeModal();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && mask.classList.contains('show')) closeModal();
    if(e.key === 'Enter' && mask.classList.contains('show')) saveGame();
  });

  grid.addEventListener('click', function(e){
    var del = e.target.closest('[data-del]');
    if(del){
      e.preventDefault();
      var i = parseInt(del.getAttribute('data-del'), 10);
      var list = getCustom();
      if(!list[i]) return;
      if(window.confirm('确定删除「' + list[i].name + '」吗？')){
        list.splice(i, 1);
        setCustom(list);
        render();
      }
      return;
    }

    if(e.target.closest('#btnRetry')) loadRepo();
  });

  /* ====== 启动 ====== */
  loadRepo();
})();
</script>

</body>
</html>
