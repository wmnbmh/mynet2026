<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<title>我的游戏库</title>
<style>
  :root{
    --bg:#05070e;
    --cyan:#00f0ff;
    --violet:#a78bfa;
    --text:#e7f2ff;
    --muted:#7c8db5;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  /* 关键：不再给 html/body 设固定高度，避免变成固定高滚动容器 */
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overflow-x:hidden;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    /* 顶端安全距离：状态栏 + 呼吸留白 */
    padding-top:calc(var(--safe-top) + 48px);
    padding-bottom:calc(var(--safe-bottom) + 48px);
    padding-left:24px;
    padding-right:24px;
    min-height:100vh;
    min-height:100svh;       /* 移动端稳定视口高度，避免地址栏抖动 */
    overflow-x:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  /* 科技网格背景 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    pointer-events:none;
    z-index:0;
  }

  /* 光晕 */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:0;
    animation:float 14s ease-in-out infinite;
  }
  .orb-1{
    width:520px;height:520px;
    max-width:90vw;max-height:90vw;
    background:rgba(0,240,255,.16);
    top:-140px;left:-120px;
  }
  .orb-2{
    width:460px;height:460px;
    max-width:80vw;max-height:80vw;
    background:rgba(139,92,246,.18);
    bottom:-160px;right:-100px;
    animation-delay:-7s;
  }
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(24px,-28px,0) scale(1.08);}
  }

  /* 内容外壳：用 auto 外边距居中 —— 内容超高时自动归零，绝不被裁切 */
  .shell{
    position:relative;
    z-index:1;
    margin:auto 0;
    width:100%;
    max-width:1180px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* 顶部状态条 */
  .status{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.22em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:26px;
    text-align:center;
    flex-wrap:wrap;
    justify-content:center;
  }
  .dot{
    flex:0 0 auto;
    width:7px;height:7px;
    border-radius:50%;
    background:#22ffa7;
    box-shadow:0 0 10px #22ffa7,0 0 22px rgba(34,255,167,.55);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.35;}}

  /* 标题 */
  h1{
    font-size:clamp(2.2rem,7vw,4.4rem);
    font-weight:800;
    letter-spacing:.06em;
    line-height:1.1;
    text-align:center;
    background:linear-gradient(180deg,#ffffff 8%,#8ef4ff 55%,#3aa9ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 5px rgba(0,240,255,.45));
    animation:titleIn .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateY(18px);filter:blur(2px);}
    to{opacity:1;transform:none;}
  }

  .subtitle{
    margin-top:16px;
    font-size:14px;
    letter-spacing:.18em;
    color:var(--muted);
    text-align:center;
    animation:titleIn 1s .12s cubic-bezier(.22,1,.36,1) both;
  }

  .divider{
    width:min(560px,80%);
    height:1px;
    margin:34px 0 40px;
    position:relative;
    background:linear-gradient(90deg,transparent,rgba(0,240,255,.55),transparent);
  }
  .divider::after{
    content:"";
    position:absolute;
    left:50%;top:50%;
    width:6px;height:6px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);
  }

  /* 按钮容器 */
  .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:stretch;
    gap:24px;
    width:100%;
  }

  /* 游戏卡片（大按钮） */
  .game-card{
    --accent:var(--cyan);
    --accent-soft:rgba(0,240,255,.20);
    --accent-glow:rgba(0,240,255,.38);

    position:relative;
    flex:1 1 300px;
    max-width:360px;
    min-width:0;             /* 防止内容撑破窄屏 */
    min-height:232px;
    padding:26px 28px 24px;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--text);
    background:
      linear-gradient(155deg,rgba(19,27,46,.92),rgba(8,12,22,.94));
    border:1px solid var(--accent-soft);
    box-shadow:
      0 22px 48px -22px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    transition:transform .4s cubic-bezier(.22,1,.36,1),
               border-color .4s, box-shadow .4s;
    animation:cardIn .8s cubic-bezier(.22,1,.36,1) both;
  }
  .game-card:nth-child(1){animation-delay:.24s;}
  .game-card:nth-child(2){animation-delay:.34s;}
  .game-card:nth-child(3){animation-delay:.44s;}
  .game-card:nth-child(4){animation-delay:.54s;}
  .game-card:nth-child(5){animation-delay:.64s;}

  @keyframes cardIn{
    from{opacity:0;transform:translateY(26px) scale(.97);}
    to{opacity:1;transform:none;}
  }

  /* 各卡片强调色 */
  .game-card.violet{
    --accent:var(--violet);
    --accent-soft:rgba(167,139,250,.24);
    --accent-glow:rgba(139,92,246,.42);
  }
  .game-card.magenta{
    --accent:#ff5ec8;
    --accent-soft:rgba(255,94,200,.22);
    --accent-glow:rgba(255,94,200,.40);
  }
  .game-card.amber{
    --accent:#ffb545;
    --accent-soft:rgba(255,181,69,.22);
    --accent-glow:rgba(255,164,32,.40);
  }
  .game-card.indigo{
    --accent:#7aa2ff;
    --accent-soft:rgba(122,162,255,.24);
    --accent-glow:rgba(90,120,255,.42);
  }

  /* 扫光 */
  .game-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.10) 50%,transparent 68%);
    transform:translateX(-120%);
    transition:transform .75s ease;
    pointer-events:none;
  }
  .game-card:hover::before{transform:translateX(120%);}

  /* 四角装饰 */
  .game-card::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:10px;
    border:1px solid transparent;
    background:
      linear-gradient(var(--accent),var(--accent)) top left/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) top left/1px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/1px 14px no-repeat;
    opacity:.55;
    pointer-events:none;
    transition:opacity .4s;
  }
  .game-card:hover::after{opacity:1;}

  .game-card:hover{
    transform:translateY(-8px);
    border-color:var(--accent);
    box-shadow:
      0 30px 60px -26px var(--accent-glow),
      0 0 0 1px var(--accent-soft),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .game-card:active{transform:translateY(-2px) scale(.99);}

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:22px;
  }
  .idx{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--accent);
    opacity:.9;
  }
  .tag{
    flex:0 0 auto;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:10.5px;
    letter-spacing:.2em;
    padding:4px 10px;
    border-radius:999px;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:rgba(255,255,255,.02);
  }

  .game-card h2{
    font-size:clamp(1.4rem,2.6vw,1.75rem);
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:12px;
    transition:text-shadow .4s;
  }
  .game-card:hover h2{
    text-shadow:0 0 24px var(--accent-glow);
  }

  .desc{
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
    letter-spacing:.05em;
  }

  .play{
    margin-top:auto;
    padding-top:22px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.2em;
    color:var(--accent);
    opacity:.75;
    transition:opacity .4s,gap .4s;
  }
  .game-card:hover .play{opacity:1;gap:14px;}

  .play svg{
    width:14px;height:14px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  footer{
    margin-top:52px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:rgba(124,141,181,.6);
    text-align:center;
  }

  /* ============ 响应式 ============ */

  /* 中等屏：两列 */
  @media (max-width:1024px){
    .game-card{flex:1 1 280px;max-width:420px;}
  }

  /* 平板竖屏：两列更宽松 */
  @media (max-width:860px){
    .grid{gap:20px;}
    .game-card{flex:1 1 260px;max-width:340px;min-height:220px;padding:24px 24px 22px;}
  }

  /* 手机：单列，卡片高度完全由内容决定，杜绝裁切 */
  @media (max-width:720px){
    body{
      padding-top:calc(var(--safe-top) + 32px);
      padding-bottom:calc(var(--safe-bottom) + 36px);
      padding-left:18px;
      padding-right:18px;
      justify-content:flex-start;
    }
    .shell{margin:0;}

    .status{
      font-size:10.5px;
      letter-spacing:.16em;
      gap:7px;
      margin-bottom:18px;
    }

    h1{font-size:clamp(1.95rem,9vw,2.6rem);}
    .subtitle{
      margin-top:12px;
      font-size:12.5px;
      letter-spacing:.1em;
      line-height:1.6;
      padding:0 4px;
    }

    .divider{margin:22px 0 26px;width:min(100%,420px);}

    .grid{
      flex-direction:column;
      flex-wrap:nowrap;
      align-items:stretch;
      gap:16px;
    }

    .game-card{
      flex:0 0 auto;
      width:100%;
      max-width:none;
      min-height:0;            /* 关键修复：不再固定最小高度 */
      padding:22px 20px 20px;
      border-radius:16px;
    }

    .card-top{margin-bottom:16px;}
    .game-card h2{font-size:1.35rem;margin-bottom:8px;}
    .desc{font-size:13px;line-height:1.65;}

    .play{
      padding-top:18px;
      font-size:11.5px;
      letter-spacing:.18em;
    }

    footer{
      margin-top:34px;
      font-size:10.5px;
      letter-spacing:.12em;
      padding-bottom:4px;
    }
  }

  /* 超窄屏（≤380px，如 iPhone SE） */
  @media (max-width:380px){
    body{padding-left:14px;padding-right:14px;}
    h1{font-size:1.8rem;}
    .game-card{padding:20px 16px 18px;}
    .tag{font-size:9.5px;padding:3px 8px;letter-spacing:.14em;}
    .desc{font-size:12.5px;}
  }

  /* 横屏矮屏：避免卡片被压缩 */
  @media (max-height:520px) and (orientation:landscape){
    body{padding-top:calc(var(--safe-top) + 24px);padding-bottom:calc(var(--safe-bottom) + 24px);}
    .shell{margin:0 auto;}
    h1{font-size:clamp(1.6rem,5vw,2.2rem);}
    .subtitle{display:none;}
    .divider{margin:16px 0 20px;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

</body>
</html>
