<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<title>我的游戏库</title>
<style>
  :root{
    --bg:#05070e;
    --cyan:#00f0ff;
    --violet:#a78bfa;
    --text:#e7f2ff;
    --muted:#7c8db5;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overflow-x:hidden;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:calc(var(--safe-top) + 44px);
    padding-bottom:calc(var(--safe-bottom) + 48px);
    padding-left:24px;
    padding-right:24px;
    min-height:100vh;
    min-height:100svh;
    overflow-x:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  body.modal-open{overflow:hidden;}

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    pointer-events:none;
    z-index:0;
  }

  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:0;
    animation:float 14s ease-in-out infinite;
  }
  .orb-1{
    width:520px;height:520px;max-width:90vw;max-height:90vw;
    background:rgba(0,240,255,.16);
    top:-140px;left:-120px;
  }
  .orb-2{
    width:460px;height:460px;max-width:80vw;max-height:80vw;
    background:rgba(139,92,246,.18);
    bottom:-160px;right:-100px;
    animation-delay:-7s;
  }
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(24px,-28px,0) scale(1.08);}
  }

  .shell{
    position:relative;
    z-index:1;
    margin:auto 0;
    width:100%;
    max-width:1180px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .topbar{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }

  .status{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.22em;
    color:var(--muted);
    text-transform:uppercase;
    flex-wrap:wrap;
  }
  .dot{
    flex:0 0 auto;
    width:7px;height:7px;
    border-radius:50%;
    background:#22ffa7;
    box-shadow:0 0 10px #22ffa7,0 0 22px rgba(34,255,167,.55);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.35;}}

  .btn-new{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    letter-spacing:.06em;
    color:#04121a;
    border:none;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(135deg,#a9f8ff,#00d5ff 45%,#3aa9ff);
    box-shadow:0 10px 26px -12px rgba(0,213,255,.95),inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .25s,box-shadow .25s,filter .25s;
    white-space:nowrap;
  }
  .btn-new:hover{
    transform:translateY(-2px);
    filter:brightness(1.06);
    box-shadow:0 16px 34px -14px rgba(0,213,255,1),inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-new:active{transform:translateY(0) scale(.98);}

  h1{
    font-size:clamp(2.2rem,7vw,4.4rem);
    font-weight:800;
    letter-spacing:.06em;
    line-height:1.1;
    text-align:center;
    background:linear-gradient(180deg,#ffffff 8%,#8ef4ff 55%,#3aa9ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 5px rgba(0,240,255,.45));
    animation:titleIn .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateY(18px);filter:blur(2px);}
    to{opacity:1;transform:none;}
  }

  .subtitle{
    margin-top:16px;
    font-size:14px;
    letter-spacing:.18em;
    color:var(--muted);
    text-align:center;
    animation:titleIn 1s .12s cubic-bezier(.22,1,.36,1) both;
  }

  .divider{
    width:min(560px,80%);
    height:1px;
    margin:34px 0 40px;
    position:relative;
    background:linear-gradient(90deg,transparent,rgba(0,240,255,.55),transparent);
  }
  .divider::after{
    content:"";
    position:absolute;
    left:50%;top:50%;
    width:6px;height:6px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);
  }

  /* 非阻塞提示条 */
  .notice{
    display:none;
    width:100%;
    max-width:760px;
    margin:0 0 24px;
    padding:11px 16px;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    border-radius:12px;
    background:rgba(255,181,69,.08);
    border:1px solid rgba(255,181,69,.32);
    color:#ffcf8a;
    font-size:12.5px;
    line-height:1.6;
    letter-spacing:.04em;
    text-align:center;
  }
  .notice.show{display:flex;}
  .notice b{color:#ffdda8;font-weight:700;}
  .notice button{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
    letter-spacing:.14em;
    padding:6px 14px;
    border-radius:999px;
    color:#ffcf8a;
    background:rgba(255,181,69,.14);
    border:1px solid rgba(255,181,69,.45);
    cursor:pointer;
    transition:background .25s;
    white-space:nowrap;
  }
  .notice button:hover{background:rgba(255,181,69,.28);}

  /* 卡片容器 */
  .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:stretch;
    gap:24px;
    width:100%;
  }

  .card-slot{
    position:relative;
    display:flex;
    flex:1 1 300px;
    max-width:360px;
    min-width:0;
  }

  .game-card{
    --accent:var(--cyan);
    --accent-soft:rgba(0,240,255,.20);
    --accent-glow:rgba(0,240,255,.38);

    position:relative;
    flex:1 1 auto;
    width:100%;
    max-width:none;
    min-width:0;
    min-height:232px;
    padding:26px 28px 24px;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--text);
    background:linear-gradient(155deg,rgba(19,27,46,.92),rgba(8,12,22,.94));
    border:1px solid var(--accent-soft);
    box-shadow:
      0 22px 48px -22px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    transition:transform .4s cubic-bezier(.22,1,.36,1),
               border-color .4s, box-shadow .4s;
    animation:cardIn .7s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px) scale(.97);}
    to{opacity:1;transform:none;}
  }

  .game-card.violet{
    --accent:var(--violet);
    --accent-soft:rgba(167,139,250,.24);
    --accent-glow:rgba(139,92,246,.42);
  }
  .game-card.magenta{
    --accent:#ff5ec8;
    --accent-soft:rgba(255,94,200,.22);
    --accent-glow:rgba(255,94,200,.40);
  }
  .game-card.amber{
    --accent:#ffb545;
    --accent-soft:rgba(255,181,69,.22);
    --accent-glow:rgba(255,164,32,.40);
  }
  .game-card.indigo{
    --accent:#7aa2ff;
    --accent-soft:rgba(122,162,255,.24);
    --accent-glow:rgba(90,120,255,.42);
  }

  .game-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.10) 50%,transparent 68%);
    transform:translateX(-120%);
    transition:transform .75s ease;
    pointer-events:none;
  }
  .game-card:hover::before{transform:translateX(120%);}

  .game-card::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:10px;
    border:1px solid transparent;
    background:
      linear-gradient(var(--accent),var(--accent)) top left/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) top left/1px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/1px 14px no-repeat;
    opacity:.55;
    pointer-events:none;
    transition:opacity .4s;
  }
  .game-card:hover::after{opacity:1;}

  .game-card:hover{
    transform:translateY(-8px);
    border-color:var(--accent);
    box-shadow:
      0 30px 60px -26px var(--accent-glow),
      0 0 0 1px var(--accent-soft),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .game-card:active{transform:translateY(-2px) scale(.99);}

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:22px;
  }
  .idx{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--accent);
    opacity:.9;
  }
  .tag{
    flex:0 0 auto;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:10.5px;
    letter-spacing:.2em;
    padding:4px 10px;
    border-radius:999px;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:rgba(255,255,255,.02);
  }

  .game-card h2{
    font-size:clamp(1.4rem,2.6vw,1.75rem);
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:12px;
    overflow-wrap:anywhere;
    transition:text-shadow .4s;
  }
  .game-card:hover h2{
    text-shadow:0 0 24px var(--accent-glow);
  }

  .desc{
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
    letter-spacing:.05em;
    overflow-wrap:anywhere;
  }

  .play{
    margin-top:auto;
    padding-top:22px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.2em;
    color:var(--accent);
    opacity:.75;
    transition:opacity .4s,gap .4s;
  }
  .game-card:hover .play{opacity:1;gap:14px;}

  .play svg{
    width:14px;height:14px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .del-btn{
    position:absolute;
    top:-9px;right:-9px;
    z-index:3;
    width:27px;height:27px;
    display:grid;
    place-items:center;
    border-radius:50%;
    cursor:pointer;
    font-size:12px;
    line-height:1;
    color:#ff8098;
    background:rgba(28,10,18,.9);
    border:1px solid rgba(255,90,120,.5);
    box-shadow:0 6px 16px -8px rgba(255,60,100,.9);
    opacity:0;
    transform:scale(.85);
    transition:opacity .25s,transform .25s,background .25s;
  }
  .card-slot:hover .del-btn,
  .card-slot:focus-within .del-btn{opacity:1;transform:scale(1);}
  .del-btn:hover{background:rgba(255,60,100,.28);}
  @media (hover:none){ .del-btn{opacity:1;transform:scale(1);} }

  .skeleton{
    flex:1 1 300px;
    max-width:360px;
    min-height:232px;
    border-radius:18px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(155deg,rgba(19,27,46,.75),rgba(8,12,22,.85));
    border:1px solid rgba(0,240,255,.12);
  }
  .skeleton::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(0,240,255,.09) 50%,transparent 70%);
    animation:shimmer 1.5s linear infinite;
  }
  @keyframes shimmer{
    from{transform:translateX(-100%);}
    to{transform:translateX(100%);}
  }

  .state{
    flex:1 1 100%;
    width:100%;
    text-align:center;
    padding:34px 24px;
    border-radius:18px;
    background:linear-gradient(155deg,rgba(19,27,46,.7),rgba(8,12,22,.8));
    border:1px dashed rgba(0,240,255,.22);
  }
  .state-icon{
    width:44px;height:44px;
    margin:0 auto 16px;
    display:grid;
    place-items:center;
    border-radius:50%;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:20px;
    font-weight:700;
    color:#8ef4ff;
    border:1px solid rgba(0,240,255,.45);
    background:rgba(0,240,255,.08);
    box-shadow:0 0 26px -8px rgba(0,240,255,.8);
  }
  .state h3{
    font-size:1.05rem;
    letter-spacing:.06em;
    margin-bottom:10px;
  }
  .state p{
    font-size:13px;
    line-height:1.7;
    color:var(--muted);
    max-width:560px;
    margin:0 auto;
    overflow-wrap:anywhere;
  }

  footer{
    margin-top:52px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:rgba(124,141,181,.6);
    text-align:center;
  }

  /* 弹窗 */
  .modal-mask{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(2,5,12,.74);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    opacity:0;
    visibility:hidden;
    transition:opacity .28s ease,visibility .28s;
  }
  .modal-mask.show{opacity:1;visibility:visible;}

  .modal{
    width:min(420px,100%);
    max-height:calc(100svh - 40px);
    overflow-y:auto;
    padding:28px 26px 24px;
    border-radius:18px;
    background:linear-gradient(155deg,rgba(22,31,52,.98),rgba(9,13,24,.99));
    border:1px solid rgba(0,240,255,.28);
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.95),
      0 0 0 1px rgba(0,240,255,.08),
      0 0 60px -30px rgba(0,240,255,.7);
    transform:translateY(14px) scale(.97);
    transition:transform .28s cubic-bezier(.22,1,.36,1);
  }
  .modal-mask.show .modal{transform:none;}

  .modal h3{
    font-size:1.15rem;
    letter-spacing:.06em;
    margin-bottom:6px;
    background:linear-gradient(180deg,#fff,#8ef4ff);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .modal-tip{
    font-size:12px;
    line-height:1.7;
    color:var(--muted);
    margin-bottom:20px;
  }

  .field{display:block;margin-bottom:16px;}
  .field span{
    display:block;
    margin-bottom:7px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    font-family:inherit;
    font-size:16px;
    color:var(--text);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(0,240,255,.22);
    border-radius:10px;
    outline:none;
    transition:border-color .25s,box-shadow .25s,background .25s;
    -webkit-appearance:none;
    appearance:none;
  }
  .field input::placeholder{color:rgba(124,141,181,.6);}
  .field input:focus{
    border-color:rgba(0,240,255,.75);
    background:rgba(0,240,255,.05);
    box-shadow:0 0 0 3px rgba(0,240,255,.12);
  }

  .modal-err{
    min-height:18px;
    margin-bottom:12px;
    font-size:12px;
    color:#ff8fa8;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .modal-actions button{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    letter-spacing:.06em;
    padding:11px 22px;
    border-radius:10px;
    cursor:pointer;
    transition:transform .2s,filter .2s,background .2s;
  }
  .btn-ghost{
    color:var(--muted);
    background:transparent;
    border:1px solid rgba(124,141,181,.4);
  }
  .btn-ghost:hover{color:var(--text);border-color:rgba(124,141,181,.8);}
  .btn-primary{
    color:#04121a;
    border:none;
    background:linear-gradient(135deg,#a9f8ff,#00d5ff 45%,#3aa9ff);
    box-shadow:0 10px 26px -12px rgba(0,213,255,.95);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .modal-actions button:active{transform:scale(.97);}

  /* 响应式 */
  @media (max-width:1024px){
    .card-slot{flex:1 1 280px;max-width:420px;}
    .skeleton{flex:1 1 280px;max-width:420px;}
  }

  @media (max-width:860px){
    .grid{gap:20px;}
    .card-slot{flex:1 1 260px;max-width:340px;}
    .skeleton{flex:1 1 260px;max-width:340px;min-height:220px;}
    .game-card{min-height:220px;padding:24px 24px 22px;}
  }

  @media (max-width:720px){
    body{
      padding-top:calc(var(--safe-top) + 28px);
      padding-bottom:calc(var(--safe-bottom) + 36px);
      padding-left:18px;
      padding-right:18px;
      justify-content:flex-start;
    }
    .shell{margin:0;}

    .topbar{margin-bottom:18px;gap:10px;align-items:flex-start;}
    .status{font-size:10px;letter-spacing:.14em;gap:7px;padding-top:8px;}
    .btn-new{font-size:12.5px;padding:9px 15px;letter-spacing:.04em;}

    h1{font-size:clamp(1.95rem,9vw,2.6rem);}
    .subtitle{
      margin-top:12px;
      font-size:12.5px;
      letter-spacing:.1em;
      line-height:1.6;
      padding:0 4px;
    }

    .divider{margin:22px 0 26px;width:min(100%,420px);}

    .notice{
      font-size:12px;
      padding:10px 13px;
      margin-bottom:18px;
      border-radius:10px;
    }

    .grid{
      flex-direction:column;
      flex-wrap:nowrap;
      align-items:stretch;
      gap:16px;
    }

    .card-slot{flex:0 0 auto;width:100%;max-width:none;}
    .skeleton{flex:0 0 auto;width:100%;max-width:none;min-height:170px;}

    .game-card{
      min-height:0;
      padding:22px 20px 20px;
      border-radius:16px;
    }

    .card-top{margin-bottom:16px;}
    .game-card h2{font-size:1.35rem;margin-bottom:8px;}
    .desc{font-size:13px;line-height:1.65;}
    .play{padding-top:18px;font-size:11.5px;letter-spacing:.18em;}

    .del-btn{top:-8px;right:-8px;width:28px;height:28px;}

    .state{padding:28px 18px;}
    .state p{font-size:12.5px;}

    footer{
      margin-top:34px;
      font-size:10.5px;
      letter-spacing:.12em;
      padding-bottom:4px;
    }

    .modal{padding:24px 20px 20px;border-radius:16px;}
    .modal-actions{flex-direction:column-reverse;}
    .modal-actions button{width:100%;}
  }

  @media (max-width:380px){
    body{padding-left:14px;padding-right:14px;}
    h1{font-size:1.8rem;}
    .game-card{padding:20px 16px 18px;}
    .tag{font-size:9.5px;padding:3px 8px;letter-spacing:.14em;}
    .desc{font-size:12.5px;}
    .btn-new{font-size:12px;padding:8px 13px;}
  }

  @media (max-height:520px) and (orientation:landscape){
    body{padding-top:calc(var(--safe-top) + 20px);padding-bottom:calc(var(--safe-bottom) + 20px);}
    .shell{margin:0 auto;}
    h1{font-size:clamp(1.6rem,5vw,2.2rem);}
    .subtitle{display:none;}
    .divider{margin:16px 0 20px;}
    .game-card{min-height:0;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="shell">

    <div class="topbar">
      <div class="status">
        <span class="dot"></span>
        SYSTEM ONLINE&nbsp;//&nbsp;GAME LIBRARY
      </div>
      <button class="btn-new" id="btnNew" type="button">＋ 新建游戏</button>
    </div>

    <h1>我的游戏库</h1>
    <p class="subtitle" id="subtitle">正在扫描仓库…</p>

    <div class="divider"></div>

    <div class="notice" id="notice"></div>

    <main class="grid" id="grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>

    <footer>// AUTO SYNCED FROM GITHUB</footer>

  </div>

  <div class="modal-mask" id="mask" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">新建游戏</h3>
      <p class="modal-tip">游戏保存在本机浏览器里。链接可以直接填 <b>xxx.html</b>（同目录文件），也可以填完整网址。</p>

      <label class="field">
        <span>游戏名称</span>
        <input id="inName" type="text" maxlength="40" placeholder="例如：极限拉扯" autocomplete="off" enterkeyhint="next">
      </label>

      <label class="field">
        <span>游戏链接</span>
        <input id="inUrl" type="text" maxlength="500" placeholder="例如：ExtremeTension.html" autocomplete="off" enterkeyhint="done">
      </label>

      <p class="modal-err" id="modalErr"></p>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btnCancel">取消</button>
        <button type="button" class="btn-primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  /* ========== 配置区 ========== */

  /* 依次尝试的 API 地址：优先用 Pages 域名里的用户名 wnmbmh，其次尝试你写的 wmnmhm */
  var API_CANDIDATES = [
    'https://api.github.com/repos/wnmbmh/mynet2026/contents/?ref=main',
    'https://api.github.com/repos/wmnmhm/mynet2026/contents/?ref=main'
  ];

  /* 兜底数据：接口完全不可用时，仍然显示这些游戏 */
  var FALLBACK_GAMES = [
    { name: '数字融合',   url: 'number.html',            desc: '点击分裂，拖拽合成' },
    { name: '打砖块',     url: 'breakout.html',          desc: '移动鼠标接球，打碎所有砖块' },
    { name: '极限拉扯',   url: 'ExtremeTension.html',    desc: '按住史莱姆，疯狂揉捏拉扯' },
    { name: '赛博龙卷风', url: 'tornado.html',           desc: '拖动龙卷风，卷碎掉落物' },
    { name: '黑洞涂鸦',   url: 'blackholegraffiti.html', desc: '手指随意涂鸦，看线条被引力吞噬' }
  ];

  var LS_KEY  = 'gamehub:customGames:v1';
  var ACCENTS = ['', 'violet', 'magenta', 'amber', 'indigo'];

  /* ========== 元素 ========== */
  var grid     = document.getElementById('grid');
  var subtitle = document.getElementById('subtitle');
  var notice   = document.getElementById('notice');
  var mask     = document.getElementById('mask');
  var inName   = document.getElementById('inName');
  var inUrl    = document.getElementById('inUrl');
  var modalErr = document.getElementById('modalErr');

  /* ========== 状态 ========== */
  var repoGames  = [];     // 当前展示的仓库/兜底游戏
  var dataSource = '';     // 'api' | 'fallback' | ''
  var noticeText = '';     // 非阻塞提示文案

  /* ========== 工具 ========== */
  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function getCustom(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(arr)) return [];
      return arr.filter(function(g){
        return g && typeof g.name === 'string' && typeof g.url === 'string' && g.name && g.url;
      });
    }catch(e){ return []; }
  }

  function setCustom(list){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }catch(e){}
  }

  function isAbsolute(url){
    return /^(https?:)?\/\//i.test(url) || /^(mailto|tel):/i.test(url);
  }

  function errText(err){
    var msg = err && err.message;
    if(err && err.name === 'AbortError') return '请求超时，网络可能较慢。';
    if(msg === 'RATE')    return 'GitHub 接口访问次数已达上限（未登录每小时 60 次），请稍后再试。';
    if(msg === 'NOTFOUND')return '未找到仓库目录（404），请确认仓库名与分支是 main。';
    if(msg === 'FORMAT')  return '接口返回的数据格式异常。';
    if(/^HTTP/.test(msg || '')) return '服务器返回异常（' + msg + '）。';
    return '网络请求失败，可能是断网或浏览器插件拦截。';
  }

  /* ========== 渲染 ========== */
  function cardHTML(game, index, customIndex){
    var accent = ACCENTS[index % ACCENTS.length];
    var num = String(index + 1);
    if(num.length < 2) num = '0' + num;

    var isCustom = game.source === 'custom';
    var tag = isCustom ? 'CUSTOM' : (game.source === 'fallback' ? 'CACHED' : 'HTML');
    var delay = (0.18 + Math.min(index, 8) * 0.07).toFixed(2);

    return '' +
      '<div class="card-slot">' +
        '<a class="game-card ' + accent + '" href="' + esc(game.url) + '" target="_blank" rel="noopener"' +
          ' style="animation-delay:' + delay + 's">' +
          '<div class="card-top">' +
            '<span class="idx">' + num + '</span>' +
            '<span class="tag">' + tag + '</span>' +
          '</div>' +
          '<h2>' + esc(game.name) + '</h2>' +
          '<p class="desc">' + esc(game.desc) + '</p>' +
          '<span class="play">START' +
            '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
          '</span>' +
        '</a>' +
        (isCustom
          ? '<button type="button" class="del-btn" data-del="' + customIndex +
            '" aria-label="删除 ' + esc(game.name) + '" title="删除">✕</button>'
          : '') +
      '</div>';
  }

  function render(){
    /* 自定义游戏去重：和已有列表链接相同的就不再重复显示 */
    var seen = {};
    repoGames.forEach(function(g){
      seen[String(g.url).toLowerCase()] = true;
    });

    var custom = getCustom().filter(function(g){
      var key = String(g.url).toLowerCase();
      if(seen[key]) return false;
      seen[key] = true;
      return true;
    }).map(function(g){
      return { name: g.name, url: g.url, desc: '自定义游戏 · 本机保存', source: 'custom' };
    });

    var total = repoGames.length + custom.length;

    if(!total){
      subtitle.textContent = '暂无游戏 · 点右上角新建一个';
    }else if(dataSource === 'fallback'){
      subtitle.textContent = '已加载 ' + total + ' 款游戏 · 内置备用列表';
    }else{
      subtitle.textContent = '已加载 ' + total + ' 款游戏 · 选择你的战场';
    }

    /* 非阻塞提示条 */
    if(noticeText){
      notice.className = 'notice show';
      notice.innerHTML =
        '<span>⚠ ' + esc(noticeText) + ' 当前显示内置备用游戏，功能不受影响。</span>' +
        '<button type="button" id="btnRetry">重新扫描</button>';
    }else{
      notice.className = 'notice';
      notice.innerHTML = '';
    }

    var html = '';

    repoGames.forEach(function(g, i){
      html += cardHTML(g, i, -1);
    });

    custom.forEach(function(g, i){
      html += cardHTML(g, repoGames.length + i, i);
    });

    if(!total){
      html +=
        '<div class="state">' +
          '<div class="state-icon">+</div>' +
          '<h3>还没有游戏</h3>' +
          '<p>把任意 .html 文件推到仓库根目录并刷新页面，卡片会自动出现；也可以点右上角「新建游戏」手动添加。</p>' +
        '</div>';
    }

    grid.innerHTML = html;
  }

  /* ========== 请求 ========== */
  function fetchJSON(url){
    var opts = {
      headers: { 'Accept': 'application/vnd.github+json' },
      cache: 'no-store'
    };

    var ctrl = null;
    var timer = null;
    if(typeof AbortController !== 'undefined'){
      ctrl = new AbortController();
      opts.signal = ctrl.signal;
      timer = setTimeout(function(){ ctrl.abort(); }, 9000);
    }

    return fetch(url, opts).then(function(res){
      if(timer) clearTimeout(timer);
      if(res.status === 403 || res.status === 429) throw new Error('RATE');
      if(res.status === 404) throw new Error('NOTFOUND');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }, function(err){
      if(timer) clearTimeout(timer);
      throw err;
    });
  }

  function parseContents(data){
    if(!Array.isArray(data)) throw new Error('FORMAT');

    return data.filter(function(item){
      return item && item.type === 'file' &&
             /\.html?$/i.test(item.name) &&
             item.name.toLowerCase() !== 'index.html';
    }).map(function(item){
      return {
        name: item.name.replace(/\.html?$/i, ''),
        url: item.name,
        desc: '点击进入 · ' + item.name,
        source: 'repo'
      };
    }).sort(function(a, b){
      return a.name.localeCompare(b.name, 'zh-Hans-CN');
    });
  }

  function useFallback(reason){
    repoGames = FALLBACK_GAMES.map(function(g){
      return { name: g.name, url: g.url, desc: g.desc, source: 'fallback' };
    });
    dataSource = 'fallback';
    noticeText = reason;
    render();
  }

  function loadRepo(){
    var i = 0;
    var lastError = null;

    noticeText = '';
    dataSource = '';
    grid.innerHTML =
      '<div class="skeleton"></div><div class="skeleton"></div>' +
      '<div class="skeleton"></div><div class="skeleton"></div>';
    subtitle.textContent = '正在扫描仓库…';

    function tryNext(){
      if(i >= API_CANDIDATES.length){
        useFallback(errText(lastError));
        return;
      }

      var url = API_CANDIDATES[i++];

      fetchJSON(url).then(function(data){
        repoGames = parseContents(data);
        dataSource = 'api';
        noticeText = '';
        render();
      }).catch(function(err){
        lastError = err;
        tryNext();   // 换下一个候选地址再试
      });
    }

    tryNext();
  }

  /* ========== 弹窗 ========== */
  function openModal(){
    inName.value = '';
    inUrl.value  = '';
    modalErr.textContent = '';
    mask.classList.add('show');
    mask.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    setTimeout(function(){ inName.focus(); }, 80);
  }

  function closeModal(){
    mask.classList.remove('show');
    mask.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
  }

  function saveGame(){
    var name = inName.value.trim();
    var url  = inUrl.value.trim();

    if(!name){ modalErr.textContent = '请填写游戏名称'; inName.focus(); return; }
    if(!url){ modalErr.textContent = '请填写游戏链接'; inUrl.focus(); return; }
    if(/^\s*(javascript|data|vbscript):/i.test(url)){
      modalErr.textContent = '链接格式不支持，请填写普通网址或文件名';
      inUrl.focus();
      return;
    }

    var list = getCustom();
    var dup = list.some(function(g){
      return g.name.toLowerCase() === name.toLowerCase() && g.url === url;
    });
    if(dup){ modalErr.textContent = '已经存在同名同链接的游戏了'; return; }

    list.push({ name: name.slice(0, 40), url: url });
    setCustom(list);
    closeModal();
    render();
  }

  /* ========== 事件 ========== */
  document.getElementById('btnNew').addEventListener('click', openModal);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('btnSave').addEventListener('click', saveGame);

  mask.addEventListener('click', function(e){
    if(e.target === mask) closeModal();
  });

  document.addEventListener('keydown', function(e){
    if(!mask.classList.contains('show')) return;
    if(e.key === 'Escape') closeModal();
    if(e.key === 'Enter') saveGame();
  });

  grid.addEventListener('click', function(e){
    var del = e.target.closest('[data-del]');
    if(del){
      e.preventDefault();
      var i = parseInt(del.getAttribute('data-del'), 10);
      var list = getCustom();
      if(!list[i]) return;
      if(window.confirm('确定删除「' + list[i].name + '」吗？')){
        list.splice(i, 1);
        setCustom(list);
        render();
      }
    }
  });

  notice.addEventListener('click', function(e){
    if(e.target.closest('#btnRetry')) loadRepo();
  });

  /* ========== 启动 ========== */
  loadRepo();
})();
</script>

</body>
</html>
