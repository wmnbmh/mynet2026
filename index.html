<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<title>我的游戏库</title>
<style>
  :root{
    --bg:#05070e;
    --cyan:#00f0ff;
    --violet:#a78bfa;
    --text:#e7f2ff;
    --muted:#7c8db5;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overflow-x:hidden;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:calc(var(--safe-top) + 44px);
    padding-bottom:calc(var(--safe-bottom) + 48px);
    padding-left:24px;
    padding-right:24px;
    min-height:100vh;
    min-height:100svh;
    overflow-x:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  /* 科技网格背景 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    mask-image:radial-gradient(circle at 50% 42%,#000 18%,transparent 76%);
    pointer-events:none;
    z-index:0;
  }

  /* 光晕 */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:0;
    animation:float 14s ease-in-out infinite;
  }
  .orb-1{
    width:520px;height:520px;max-width:90vw;max-height:90vw;
    background:rgba(0,240,255,.16);
    top:-140px;left:-120px;
  }
  .orb-2{
    width:460px;height:460px;max-width:80vw;max-height:80vw;
    background:rgba(139,92,246,.18);
    bottom:-160px;right:-100px;
    animation-delay:-7s;
  }
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(24px,-28px,0) scale(1.08);}
  }

  /* 内容外壳 */
  .shell{
    position:relative;
    z-index:1;
    margin:auto 0;
    width:100%;
    max-width:1180px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* 顶部状态条：居中胶囊 */
  .topbar{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:28px;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:7px 16px;
    border-radius:999px;
    border:1px solid rgba(0,240,255,.16);
    background:rgba(0,240,255,.04);
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:var(--muted);
    text-transform:uppercase;
    white-space:nowrap;
  }
  .dot{
    flex:0 0 auto;
    width:7px;height:7px;
    border-radius:50%;
    background:#22ffa7;
    box-shadow:0 0 10px #22ffa7,0 0 22px rgba(34,255,167,.55);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.35;}}

  /* 标题 */
  h1{
    font-size:clamp(2.2rem,7vw,4.4rem);
    font-weight:800;
    letter-spacing:.06em;
    line-height:1.1;
    text-align:center;
    background:linear-gradient(180deg,#ffffff 8%,#8ef4ff 55%,#3aa9ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 5px rgba(0,240,255,.45));
    animation:titleIn .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateY(18px);filter:blur(2px);}
    to{opacity:1;transform:none;}
  }

  .subtitle{
    margin-top:16px;
    font-size:14px;
    letter-spacing:.18em;
    color:var(--muted);
    text-align:center;
    animation:titleIn 1s .12s cubic-bezier(.22,1,.36,1) both;
  }

  .divider{
    width:min(560px,80%);
    height:1px;
    margin:34px 0 40px;
    position:relative;
    background:linear-gradient(90deg,transparent,rgba(0,240,255,.55),transparent);
  }
  .divider::after{
    content:"";
    position:absolute;
    left:50%;top:50%;
    width:6px;height:6px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);
  }

  /* 非阻塞提示条 */
  .notice{
    display:none;
    width:100%;
    max-width:760px;
    margin:0 0 24px;
    padding:11px 16px;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    border-radius:12px;
    background:rgba(255,181,69,.08);
    border:1px solid rgba(255,181,69,.32);
    color:#ffcf8a;
    font-size:12.5px;
    line-height:1.6;
    letter-spacing:.04em;
    text-align:center;
  }
  .notice.show{display:flex;}
  .notice button{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
    letter-spacing:.14em;
    padding:6px 14px;
    border-radius:999px;
    color:#ffcf8a;
    background:rgba(255,181,69,.14);
    border:1px solid rgba(255,181,69,.45);
    cursor:pointer;
    transition:background .25s;
    white-space:nowrap;
  }
  .notice button:hover{background:rgba(255,181,69,.28);}

  /* 卡片容器 */
  .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:stretch;
    gap:24px;
    width:100%;
  }

  /* 游戏卡片 */
  .game-card{
    --accent:var(--cyan);
    --accent-soft:rgba(0,240,255,.20);
    --accent-glow:rgba(0,240,255,.38);

    position:relative;
    flex:1 1 300px;
    max-width:360px;
    min-width:0;
    min-height:232px;
    padding:26px 28px 24px;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--text);
    background:linear-gradient(155deg,rgba(19,27,46,.92),rgba(8,12,22,.94));
    border:1px solid var(--accent-soft);
    box-shadow:
      0 22px 48px -22px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    transition:transform .4s cubic-bezier(.22,1,.36,1),
               border-color .4s, box-shadow .4s;
    animation:cardIn .7s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px) scale(.97);}
    to{opacity:1;transform:none;}
  }

  .game-card.violet{
    --accent:var(--violet);
    --accent-soft:rgba(167,139,250,.24);
    --accent-glow:rgba(139,92,246,.42);
  }
  .game-card.magenta{
    --accent:#ff5ec8;
    --accent-soft:rgba(255,94,200,.22);
    --accent-glow:rgba(255,94,200,.40);
  }
  .game-card.amber{
    --accent:#ffb545;
    --accent-soft:rgba(255,181,69,.22);
    --accent-glow:rgba(255,164,32,.40);
  }
  .game-card.indigo{
    --accent:#7aa2ff;
    --accent-soft:rgba(122,162,255,.24);
    --accent-glow:rgba(90,120,255,.42);
  }

  /* 扫光 */
  .game-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.10) 50%,transparent 68%);
    transform:translateX(-120%);
    transition:transform .75s ease;
    pointer-events:none;
  }
  .game-card:hover::before{transform:translateX(120%);}

  /* 四角装饰 */
  .game-card::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:10px;
    border:1px solid transparent;
    background:
      linear-gradient(var(--accent),var(--accent)) top left/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) top left/1px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/14px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) bottom right/1px 14px no-repeat;
    opacity:.55;
    pointer-events:none;
    transition:opacity .4s;
  }
  .game-card:hover::after{opacity:1;}

  .game-card:hover{
    transform:translateY(-8px);
    border-color:var(--accent);
    box-shadow:
      0 30px 60px -26px var(--accent-glow),
      0 0 0 1px var(--accent-soft),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .game-card:active{transform:translateY(-2px) scale(.99);}

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:22px;
  }
  .idx{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--accent);
    opacity:.9;
  }
  .tag{
    flex:0 0 auto;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:10.5px;
    letter-spacing:.2em;
    padding:4px 10px;
    border-radius:999px;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:rgba(255,255,255,.02);
  }

  .game-card h2{
    font-size:clamp(1.4rem,2.6vw,1.75rem);
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:12px;
    overflow-wrap:anywhere;
    transition:text-shadow .4s;
  }
  .game-card:hover h2{
    text-shadow:0 0 24px var(--accent-glow);
  }

  .desc{
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
    letter-spacing:.05em;
    overflow-wrap:anywhere;
  }

  .play{
    margin-top:auto;
    padding-top:22px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.2em;
    color:var(--accent);
    opacity:.75;
    transition:opacity .4s,gap .4s;
  }
  .game-card:hover .play{opacity:1;gap:14px;}

  .play svg{
    width:14px;height:14px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* 骨架屏 */
  .skeleton{
    flex:1 1 300px;
    max-width:360px;
    min-height:232px;
    border-radius:18px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(155deg,rgba(19,27,46,.75),rgba(8,12,22,.85));
    border:1px solid rgba(0,240,255,.12);
  }
  .skeleton::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(0,240,255,.09) 50%,transparent 70%);
    animation:shimmer 1.5s linear infinite;
  }
  @keyframes shimmer{
    from{transform:translateX(-100%);}
    to{transform:translateX(100%);}
  }

  /* 空状态 */
  .state{
    flex:1 1 100%;
    width:100%;
    text-align:center;
    padding:34px 24px;
    border-radius:18px;
    background:linear-gradient(155deg,rgba(19,27,46,.7),rgba(8,12,22,.8));
    border:1px dashed rgba(0,240,255,.22);
  }
  .state-icon{
    width:44px;height:44px;
    margin:0 auto 16px;
    display:grid;
    place-items:center;
    border-radius:50%;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:20px;
    font-weight:700;
    color:#8ef4ff;
    border:1px solid rgba(0,240,255,.45);
    background:rgba(0,240,255,.08);
    box-shadow:0 0 26px -8px rgba(0,240,255,.8);
  }
  .state h3{
    font-size:1.05rem;
    letter-spacing:.06em;
    margin-bottom:10px;
  }
  .state p{
    font-size:13px;
    line-height:1.7;
    color:var(--muted);
    max-width:560px;
    margin:0 auto;
    overflow-wrap:anywhere;
  }

  footer{
    margin-top:52px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    color:rgba(124,141,181,.6);
    text-align:center;
  }

  /* ============ 响应式 ============ */

  @media (max-width:1024px){
    .game-card{flex:1 1 280px;max-width:420px;}
    .skeleton{flex:1 1 280px;max-width:420px;}
  }

  @media (max-width:860px){
    .grid{gap:20px;}
    .game-card{flex:1 1 260px;max-width:340px;min-height:220px;padding:24px 24px 22px;}
    .skeleton{flex:1 1 260px;max-width:340px;min-height:220px;}
  }

  /* 手机单列 */
  @media (max-width:720px){
    body{
      padding-top:calc(var(--safe-top) + 28px);
      padding-bottom:calc(var(--safe-bottom) + 36px);
      padding-left:18px;
      padding-right:18px;
      justify-content:flex-start;
    }
    .shell{margin:0;}

    .topbar{margin-bottom:20px;}
    .status{
      font-size:10px;
      letter-spacing:.14em;
      padding:6px 13px;
      gap:7px;
    }

    h1{font-size:clamp(1.95rem,9vw,2.6rem);}
    .subtitle{
      margin-top:12px;
      font-size:12.5px;
      letter-spacing:.1em;
      line-height:1.6;
      padding:0 4px;
    }

    .divider{margin:22px 0 26px;width:min(100%,420px);}

    .notice{font-size:12px;padding:10px 13px;margin-bottom:18px;border-radius:10px;}

    .grid{
      flex-direction:column;
      flex-wrap:nowrap;
      align-items:stretch;
      gap:16px;
    }

    .game-card{
      flex:0 0 auto;
      width:100%;
      max-width:none;
      min-height:0;
      padding:22px 20px 20px;
      border-radius:16px;
    }

    .skeleton{
      flex:0 0 auto;
      width:100%;
      max-width:none;
      min-height:170px;
    }

    .card-top{margin-bottom:16px;}
    .game-card h2{font-size:1.35rem;margin-bottom:8px;}
    .desc{font-size:13px;line-height:1.65;}
    .play{padding-top:18px;font-size:11.5px;letter-spacing:.18em;}

    .state{padding:28px 18px;}
    .state p{font-size:12.5px;}

    footer{margin-top:34px;font-size:10.5px;letter-spacing:.12em;padding-bottom:4px;}
  }

  /* 超窄屏 */
  @media (max-width:380px){
    body{padding-left:14px;padding-right:14px;}
    h1{font-size:1.8rem;}
    .game-card{padding:20px 16px 18px;}
    .tag{font-size:9.5px;padding:3px 8px;letter-spacing:.14em;}
    .desc{font-size:12.5px;}
    .status{font-size:9.5px;letter-spacing:.1em;padding:5px 11px;}
  }

  /* 横屏矮屏 */
  @media (max-height:520px) and (orientation:landscape){
    body{padding-top:calc(var(--safe-top) + 20px);padding-bottom:calc(var(--safe-bottom) + 20px);}
    .shell{margin:0 auto;}
    h1{font-size:clamp(1.6rem,5vw,2.2rem);}
    .subtitle{display:none;}
    .divider{margin:16px 0 20px;}
    .game-card{min-height:0;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="shell">

    <div class="topbar">
      <div class="status">
        <span class="dot"></span>
        SYSTEM ONLINE&nbsp;//&nbsp;GAME LIBRARY
      </div>
    </div>

    <h1>我的游戏库</h1>
    <p class="subtitle" id="subtitle">正在扫描仓库…</p>

    <div class="divider"></div>

    <div class="notice" id="notice"></div>

    <main class="grid" id="grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>

    <footer>// AUTO SYNCED FROM GITHUB</footer>

  </div>

<script>
(function(){
  'use strict';

  /* ========== 配置区 ========== */

  var API_CANDIDATES = [
    'https://api.github.com/repos/wnmbmh/mynet2026/contents/?ref=main',
    'https://api.github.com/repos/wmnmhm/mynet2026/contents/?ref=main'
  ];

  /* 兜底数据：接口不可用时显示这一份（tag 不写则默认 CACHED） */
  var FALLBACK_GAMES = [
    { name: '数字融合',   url: 'number.html',            desc: '点击分裂，拖拽合成' },
    { name: '打砖块',     url: 'breakout.html',          desc: '移动鼠标接球，打碎所有砖块' },
    { name: '极限拉扯',   url: 'ExtremeTension.html',    desc: '按住史莱姆，疯狂揉捏拉扯' },
    { name: '赛博龙卷风', url: 'tornado.html',           desc: '拖动龙卷风，卷碎掉落物' },
    { name: '黑洞涂鸦',   url: 'blackholegraffiti.html', desc: '手指随意涂鸦，看线条被引力吞噬' },
    { name: '空间破碎',   url: 'fangkuai.html',          desc: '点击进入 · fangkuai.html', tag: 'BREAK' }
  ];

  var ACCENTS = ['', 'violet', 'magenta', 'amber', 'indigo'];

  /* ========== 元素 ========== */
  var grid     = document.getElementById('grid');
  var subtitle = document.getElementById('subtitle');
  var notice   = document.getElementById('notice');

  /* ========== 状态 ========== */
  var repoGames  = [];
  var dataSource = '';
  var noticeText = '';

  /* ========== 工具 ========== */
  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function errText(err){
    var msg = err && err.message;
    if(err && err.name === 'AbortError') return '请求超时，网络可能较慢。';
    if(msg === 'RATE')    return 'GitHub 接口访问次数已达上限（未登录每小时 60 次），请稍后再试。';
    if(msg === 'NOTFOUND')return '未找到仓库目录（404），请确认仓库名与分支是 main。';
    if(msg === 'FORMAT')  return '接口返回的数据格式异常。';
    if(/^HTTP/.test(msg || '')) return '服务器返回异常（' + msg + '）。';
    return '网络请求失败，可能是断网或浏览器插件拦截。';
  }

  /* ========== 渲染 ========== */
  function cardHTML(game, index){
    var accent = ACCENTS[index % ACCENTS.length];
    var num = String(index + 1);
    if(num.length < 2) num = '0' + num;

    var tag = game.tag || (game.source === 'fallback' ? 'CACHED' : 'HTML');
    var delay = (0.18 + Math.min(index, 8) * 0.07).toFixed(2);

    return '' +
      '<a class="game-card ' + accent + '" href="' + esc(game.url) + '" target="_blank" rel="noopener"' +
        ' style="animation-delay:' + delay + 's">' +
        '<div class="card-top">' +
          '<span class="idx">' + num + '</span>' +
          '<span class="tag">' + esc(tag) + '</span>' +
        '</div>' +
        '<h2>' + esc(game.name) + '</h2>' +
        '<p class="desc">' + esc(game.desc) + '</p>' +
        '<span class="play">START' +
          '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
        '</span>' +
      '</a>';
  }

  function render(){
    var total = repoGames.length;

    if(!total){
      subtitle.textContent = '暂无游戏';
    }else if(dataSource === 'fallback'){
      subtitle.textContent = '已加载 ' + total + ' 款游戏 · 内置备用列表';
    }else{
      subtitle.textContent = '已加载 ' + total + ' 款游戏 · 选择你的战场';
    }

    if(noticeText){
      notice.className = 'notice show';
      notice.innerHTML =
        '<span>⚠ ' + esc(noticeText) + ' 当前显示内置备用游戏，功能不受影响。</span>' +
        '<button type="button" id="btnRetry">重新扫描</button>';
    }else{
      notice.className = 'notice';
      notice.innerHTML = '';
    }

    var html = '';

    repoGames.forEach(function(g, i){
      html += cardHTML(g, i);
    });

    if(!total){
      html +=
        '<div class="state">' +
          '<div class="state-icon">+</div>' +
          '<h3>还没有游戏</h3>' +
          '<p>把任意 .html 文件推到仓库根目录并刷新页面，卡片会自动出现。</p>' +
        '</div>';
    }

    grid.innerHTML = html;
  }

  /* ========== 请求 ========== */
  function fetchJSON(url){
    var opts = {
      headers: { 'Accept': 'application/vnd.github+json' },
      cache: 'no-store'
    };

    var ctrl = null;
    var timer = null;
    if(typeof AbortController !== 'undefined'){
      ctrl = new AbortController();
      opts.signal = ctrl.signal;
      timer = setTimeout(function(){ ctrl.abort(); }, 9000);
    }

    return fetch(url, opts).then(function(res){
      if(timer) clearTimeout(timer);
      if(res.status === 403 || res.status === 429) throw new Error('RATE');
      if(res.status === 404) throw new Error('NOTFOUND');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }, function(err){
      if(timer) clearTimeout(timer);
      throw err;
    });
  }

  function parseContents(data){
    if(!Array.isArray(data)) throw new Error('FORMAT');

    return data.filter(function(item){
      return item && item.type === 'file' &&
             /\.html?$/i.test(item.name) &&
             item.name.toLowerCase() !== 'index.html';
    }).map(function(item){
      return {
        name: item.name.replace(/\.html?$/i, ''),
        url: item.name,
        desc: '点击进入 · ' + item.name,
        source: 'repo'
      };
    }).sort(function(a, b){
      return a.name.localeCompare(b.name, 'zh-Hans-CN');
    });
  }

  function useFallback(reason){
    repoGames = FALLBACK_GAMES.map(function(g){
      return { name: g.name, url: g.url, desc: g.desc, tag: g.tag, source: 'fallback' };
    });
    dataSource = 'fallback';
    noticeText = reason;
    render();
  }

  function loadRepo(){
    var i = 0;
    var lastError = null;

    noticeText = '';
    dataSource = '';
    grid.innerHTML =
      '<div class="skeleton"></div><div class="skeleton"></div>' +
      '<div class="skeleton"></div><div class="skeleton"></div>';
    subtitle.textContent = '正在扫描仓库…';

    function tryNext(){
      if(i >= API_CANDIDATES.length){
        useFallback(errText(lastError));
        return;
      }

      var url = API_CANDIDATES[i++];

      fetchJSON(url).then(function(data){
        repoGames = parseContents(data);
        dataSource = 'api';
        noticeText = '';
        render();
      }).catch(function(err){
        lastError = err;
        tryNext();
      });
    }

    tryNext();
  }

  /* ========== 事件 ========== */
  notice.addEventListener('click', function(e){
    if(e.target.closest('#btnRetry')) loadRepo();
  });

  /* ========== 启动 ========== */
  loadRepo();
})();
</script>
