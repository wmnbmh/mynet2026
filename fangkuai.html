<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>解压方块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#07070e;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#reset{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:9;
  padding:9px 20px;border-radius:12px;border:1px solid rgba(140,170,255,.35);
  background:rgba(120,150,255,.12);color:#dfe6ff;font-size:14px;letter-spacing:2px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;
  transition:transform .15s,background .2s}
#reset:active{transform:scale(.93);background:rgba(120,150,255,.3)}
#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;
  color:#4b5270;font-size:12px;letter-spacing:3px;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<button id="reset">重置</button>
<div id="hint">拖动旋转 · 点击方块消除</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070e);
scene.fog = new THREE.Fog(0x07070e, 9, 22);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .1, 200);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(5, 7, 9); scene.add(key);
const rim = new THREE.DirectionalLight(0x7a9bff, 1.4); rim.position.set(-7, -5, -6); scene.add(rim);

const group = new THREE.Group();
group.rotation.set(-.28, .55, 0);
scene.add(group);

const N = 4, GAP = 1.02, SIZE = .6, OFF = (N - 1) * GAP / 2;
const geo = new THREE.BoxGeometry(SIZE, SIZE, SIZE);
const cubes = [];

for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) for (let z = 0; z < N; z++) {
  const hue = ((x + y * .7 + z * .42) * .115 + .02) % 1;
  const col = new THREE.Color().setHSL(hue, .8, .58);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: col, emissive: col, emissiveIntensity: .8, roughness: .35, metalness: .2
  }));
  mesh.position.set(x * GAP - OFF, y * GAP - OFF, z * GAP - OFF);
  mesh.userData = { alive:true, s:0, target:1, base:.8 };
  mesh.scale.setScalar(.001);
  group.add(mesh);
  cubes.push(mesh);
}

const ringGeo = new THREE.RingGeometry(.34, .43, 48);
const rings = [];
const tmpPos = new THREE.Vector3();

function spawnRing(pos, color) {
  const r = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color, transparent:true, opacity:.9, side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  r.position.copy(pos);
  r.quaternion.copy(camera.quaternion);
  scene.add(r);
  rings.push({ r, t:0, life:.6 });
}

const el = renderer.domElement;
const ray = new THREE.Raycaster();
const v2 = new THREE.Vector2();
const hintEl = document.getElementById('hint');
let pid = null, lx = 0, ly = 0, moved = 0, downT = 0;

function hideHint() { hintEl.style.opacity = 0; }

el.addEventListener('contextmenu', e => e.preventDefault());

el.addEventListener('pointerdown', e => {
  if (pid !== null) return;
  pid = e.pointerId;
  lx = e.clientX; ly = e.clientY; moved = 0; downT = performance.now();
  el.setPointerCapture(pid);
});

el.addEventListener('pointermove', e => {
  if (e.pointerId !== pid) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  moved += Math.hypot(dx, dy);
  group.rotation.y += dx * .0075;
  group.rotation.x += dy * .0075;
  if (moved > 12) hideHint();
});

function endDrag(e) {
  if (e.pointerId !== pid) return;
  const quick = performance.now() - downT < 500;
  pid = null;
  if (moved < 9 && quick) hitTest(e.clientX, e.clientY);
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', e => { if (e.pointerId === pid) pid = null; });

function hitTest(cx, cy) {
  v2.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(v2, camera);
  const hits = ray.intersectObjects(cubes.filter(c => c.userData.alive), false);
  if (!hits.length) return;
  const m = hits[0].object;
  m.userData.alive = false;
  m.userData.target = 0;
  m.material.emissiveIntensity = 2.4;
  m.getWorldPosition(tmpPos);
  spawnRing(tmpPos.clone(), m.material.color.clone());
  hideHint();
}

document.getElementById('reset').addEventListener('click', () => {
  for (const m of cubes) {
    m.userData.alive = true;
    m.userData.target = 1;
    m.userData.s = .02;
    m.visible = true;
    m.scale.setScalar(.02);
    m.material.emissiveIntensity = 3;
  }
  for (const { r } of rings) { scene.remove(r); r.material.dispose(); }
  rings.length = 0;
  hideHint();
});

function resize() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  camera.position.set(0, 0, Math.max(9, 6.9 / aspect));
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
resize();
addEventListener('resize', resize);

const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);

  if (pid === null) group.rotation.y += dt * .12;
  group.position.y = Math.sin(clock.elapsedTime * .8) * .12;

  for (const m of cubes) {
    const u = m.userData;
    u.s += (u.target - u.s) * Math.min(dt * 11, 1);
    if (u.target === 0 && u.s < .02) m.visible = false;
    if (m.visible) m.scale.setScalar(Math.max(u.s, .001));
    m.material.emissiveIntensity += (u.base - m.material.emissiveIntensity) * Math.min(dt * 4, 1);
  }

  for (let i = rings.length - 1; i >= 0; i--) {
    const o = rings[i];
    o.t += dt;
    const k = o.t / o.life;
    if (k >= 1) { scene.remove(o.r); o.r.material.dispose(); rings.splice(i, 1); continue; }
    o.r.scale.setScalar(.4 + k * 2.8);
    o.r.material.opacity = .9 * (1 - k) * (1 - k);
    o.r.quaternion.copy(camera.quaternion);
  }

  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
