<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05040d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>星云揉皱 · 按住揉星空</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{
    position:fixed; left:0; top:0; right:0; bottom:0;
    width:100%; height:100%;
    overflow:hidden; background:#05040d;
    touch-action:none; -ms-touch-action:none;
    -webkit-overflow-scrolling:auto;
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
    -webkit-text-size-adjust:100%;
  }
  #c{
    position:fixed; left:0; top:0;
    width:100%; height:100%;
    display:block;
    touch-action:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
  }
  #hint{
    position:fixed; left:0; right:0;
    bottom:34px;
    bottom:calc(34px + env(safe-area-inset-bottom, 0px));
    text-align:center;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size:13px; letter-spacing:2px; line-height:1.6;
    color:rgba(190,206,255,0.65);
    text-shadow:0 0 18px rgba(90,130,255,0.7);
    pointer-events:none;
    -webkit-transition:opacity .9s ease;
    transition:opacity .9s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">按住屏幕 · 揉皱星空</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var hintEl = document.getElementById('hint');

  if (!ctx) {
    document.body.innerHTML = '<div style="color:#8fa4ff;font:14px sans-serif;padding:30px;text-align:center">你的浏览器不支持 Canvas</div>';
    return;
  }

  /* ---------------------------------------------------------------
     基础状态
     --------------------------------------------------------------- */
  var W = 1, H = 1, dpr = 1, unit = 1, quality = 1;
  var bg = null, vig = null;
  var neb = [];      // 星云粒子
  var stars = [];    // 星点
  var usingTouch = false;
  var hintGone = false;

  // 指针（手指 / 鼠标）状态
  var P = {
    down: false,
    x: 0, y: 0,
    vx: 0, vy: 0,      // 快速移动产生的“风”
    hold: 0,           // 按住时长 0..1
    radius: 100
  };

  // 每帧传给粒子的力场参数（避免每帧创建闭包）
  var F = {
    down: false, px: 0, py: 0,
    R: 1, R2: 1, S: 0, wx: 0, wy: 0,
    f: 1, damp: 0.9
  };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function gauss() {
    var u = 0, v = 0;
    while (u === 0) { u = Math.random(); }
    while (v === 0) { v = Math.random(); }
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v);
  }

  /* ---------------------------------------------------------------
     预渲染精灵（软光斑 / 星点），避免每帧创建渐变
     --------------------------------------------------------------- */
  var glowCache = {};

  function glowSprite(r, g, b, core) {
    var key = r + '_' + g + '_' + b + '_' + core;
    if (glowCache[key]) { return glowCache[key]; }

    var S = 64;
    var cv = document.createElement('canvas');
    cv.width = S;
    cv.height = S;
    var c = cv.getContext('2d');
    var gr = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0.00, 'rgba(' + r + ',' + g + ',' + b + ',' + core + ')');
    gr.addColorStop(0.22, 'rgba(' + r + ',' + g + ',' + b + ',' + (core * 0.40) + ')');
    gr.addColorStop(0.52, 'rgba(' + r + ',' + g + ',' + b + ',' + (core * 0.11) + ')');
    gr.addColorStop(1.00, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    c.fillStyle = gr;
    c.fillRect(0, 0, S, S);
    glowCache[key] = cv;
    return cv;
  }

  var starCache = {};
  function starSprite(r, g, b) {
    var key = r + '_' + g + '_' + b;
    if (starCache[key]) { return starCache[key]; }

    var S = 24;
    var cv = document.createElement('canvas');
    cv.width = S;
    cv.height = S;
    var c = cv.getContext('2d');
    var gr = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0.00, 'rgba(' + r + ',' + g + ',' + b + ',1)');
    gr.addColorStop(0.14, 'rgba(' + r + ',' + g + ',' + b + ',0.72)');
    gr.addColorStop(0.34, 'rgba(' + r + ',' + g + ',' + b + ',0.16)');
    gr.addColorStop(1.00, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    c.fillStyle = gr;
    c.fillRect(0, 0, S, S);
    starCache[key] = cv;
    return cv;
  }

  var WHITE = glowSprite(255, 255, 255, 0.5);

  /* ---------------------------------------------------------------
     背景（一次性预渲染，每帧 1 次 drawImage）
     --------------------------------------------------------------- */
  function buildBG() {
    bg = document.createElement('canvas');
    var w = Math.max(2, Math.round(W * 0.5));
    var h = Math.max(2, Math.round(H * 0.5));
    bg.width = w;
    bg.height = h;
    var b = bg.getContext('2d');

    b.fillStyle = '#05040d';
    b.fillRect(0, 0, w, h);

    var blobs = [
      [0.24, 0.16, 0.80, 'rgba(52,44,124,0.60)'],
      [0.80, 0.28, 0.72, 'rgba(86,28,116,0.52)'],
      [0.46, 0.80, 0.88, 'rgba(22,64,116,0.50)'],
      [0.12, 0.66, 0.62, 'rgba(66,22,84,0.40)'],
      [0.66, 0.58, 0.66, 'rgba(30,72,132,0.34)']
    ];
    var i, bd, g;
    for (i = 0; i < blobs.length; i++) {
      bd = blobs[i];
      g = b.createRadialGradient(w * bd[0], h * bd[1], 0, w * bd[0], h * bd[1], Math.max(w, h) * bd[2]);
      g.addColorStop(0, bd[3]);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      b.fillStyle = g;
      b.fillRect(0, 0, w, h);
    }
  }

  function buildVig() {
    vig = document.createElement('canvas');
    vig.width = 128;
    vig.height = 128;
    var c = vig.getContext('2d');
    var g = c.createRadialGradient(64, 64, 8, 64, 64, 92);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    c.fillStyle = g;
    c.fillRect(0, 0, 128, 128);
  }

  /* ---------------------------------------------------------------
     生成粒子
     --------------------------------------------------------------- */
  function buildScene() {
    neb.length = 0;
    stars.length = 0;

    var base = Math.min(W, H);
    var area = W * H;

    var nNeb  = clamp(Math.round(area / 1500), 260, 880);
    var nStar = clamp(Math.round(area / 2600), 140, 480);

    // 云团骨架（让粒子聚成丝状云，而不是均匀噪点）
    var nCloud = 5 + ((Math.random() * 3) | 0);
    var clouds = [], i;
    for (i = 0; i < nCloud; i++) {
      clouds.push({
        x: W * (0.10 + Math.random() * 0.80),
        y: H * (0.10 + Math.random() * 0.80),
        r: base * (0.10 + Math.random() * 0.20)
      });
    }

    var COLS = [
      [90, 110, 255],   // 深蓝
      [186, 88, 232],   // 品红
      [64, 200, 226],   // 青
      [255, 138, 92],   // 暖橙
      [200, 150, 255]   // 淡紫
    ];

    var x, y, deep, q, ci, col, bright, spr, sz, c;
    for (i = 0; i < nNeb; i++) {
      if (Math.random() < 0.74) {
        c = clouds[(Math.random() * clouds.length) | 0];
        x = c.x + gauss() * c.r * 0.55;
        y = c.y + gauss() * c.r * 0.55;
        deep = 1;
      } else {
        x = Math.random() * W;
        y = Math.random() * H;
        deep = 0.45;
      }

      q = Math.random();
      if (q < 0.33) { ci = 0; }
      else if (q < 0.62) { ci = 1; }
      else if (q < 0.82) { ci = 2; }
      else if (q < 0.93) { ci = 3; }
      else { ci = 4; }

      col = COLS[ci];
      bright = Math.random() < 0.14;
      spr = glowSprite(col[0], col[1], col[2], bright ? 0.92 : 0.48);

      sz = base * (0.045 + Math.random() * 0.11) * (0.70 + 0.90 * deep);
      if (bright) { sz *= 1.2; }

      neb.push({
        hx: x, hy: y, x: x, y: y, vx: 0, vy: 0,
        size: sz,
        spr: spr,
        k: 0.008 + Math.random() * 0.007,
        ph: Math.random() * 6.283185,
        sp: 0.4 + Math.random() * 1.1
      });
    }

    var sx, sy, sc, sr, sg, sb;
    for (i = 0; i < nStar; i++) {
      sx = Math.random() * W;
      sy = Math.random() * H;
      sc = Math.random();
      sr = 255; sg = 255; sb = 255;
      if (sc < 0.16) { sr = 190; sg = 215; sb = 255; }
      else if (sc < 0.30) { sr = 255; sg = 232; sb = 200; }

      stars.push({
        hx: sx, hy: sy, x: sx, y: sy, vx: 0, vy: 0,
        size: 1 + Math.random() * 2.2,
        spr: starSprite(sr, sg, sb),
        k: 0.012 + Math.random() * 0.008,
        ph: Math.random() * 6.283185,
        sp: 0.8 + Math.random() * 2.2
      });
    }
  }

  /* ---------------------------------------------------------------
     物理：排斥力场 + 涡旋 + 弹簧回位
     --------------------------------------------------------------- */
  function stepP(p) {
    var f = F.f;

    if (F.down) {
      var dx = p.x - F.px;
      var dy = p.y - F.py;
      var d2 = dx * dx + dy * dy;
      if (d2 < F.R2) {
        var d = Math.sqrt(d2) + 0.0001;
        var ux = dx / d;
        var uy = dy / d;
        var fall = 1 - d / F.R;              // 0..1，靠中心最强
        var pw = F.S * fall * fall;
        // 径向排斥 + 切向涡旋（“揉”的旋转感）+ 手指拖动的风
        p.vx += (ux * pw - uy * pw * 0.70 + F.wx * fall) * f;
        p.vy += (uy * pw + ux * pw * 0.70 + F.wy * fall) * f;
      }
    }

    // 弹簧回位
    p.vx += (p.hx - p.x) * p.k * f;
    p.vy += (p.hy - p.y) * p.k * f;

    // 阻尼
    p.vx *= F.damp;
    p.vy *= F.damp;

    // 限速，防止飞出去
    var sp2 = p.vx * p.vx + p.vy * p.vy;
    if (sp2 > 900) {
      var s = 30 / Math.sqrt(sp2);
      p.vx *= s;
      p.vy *= s;
    }

    p.x += p.vx * f;
    p.y += p.vy * f;
  }

  function update(dt, f) {
    if (P.down) {
      P.hold = Math.min(1, P.hold + dt * 0.6);
    } else {
      P.hold = Math.max(0, P.hold - dt * 2.2);
    }

    P.radius = Math.min(W, H) * (0.24 + 0.15 * P.hold);

    F.down = P.down;
    F.px = P.x;
    F.py = P.y;
    F.R = P.radius;
    F.R2 = P.radius * P.radius;
    F.S = (0.50 + 0.45 * P.hold) * unit;
    F.wx = P.vx * 0.12 * unit;
    F.wy = P.vy * 0.12 * unit;
    F.f = f;
    F.damp = Math.pow(0.90, f);

    var i;
    for (i = 0; i < neb.length; i++) { stepP(neb[i]); }
    for (i = 0; i < stars.length; i++) { stepP(stars[i]); }

    // 手指速度衰减
    var dk = Math.pow(0.80, f);
    P.vx *= dk;
    P.vy *= dk;
  }

  /* ---------------------------------------------------------------
     渲染
     --------------------------------------------------------------- */
  function render(ts) {
    var t = ts * 0.001;
    var i, p, s, h, w;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // 星云
    for (i = 0; i < neb.length; i++) {
      p = neb[i];
      w = Math.sin(t * p.sp + p.ph);
      s = p.size * (1 + w * 0.05);
      h = s * 0.5;
      ctx.drawImage(p.spr, p.x + w * 1.4 - h, p.y + w * 0.9 - h, s, s);
    }

    // 星点
    for (i = 0; i < stars.length; i++) {
      p = stars[i];
      w = Math.sin(t * p.sp + p.ph);
      s = p.size * (1 + w * 0.35);
      if (s < 0.6) { s = 0.6; }
      h = s * 0.5;
      ctx.drawImage(p.spr, p.x - h, p.y - h, s, s);
    }

    // 手指下的柔光
    if (P.down || P.hold > 0.01) {
      var gs = P.radius * 1.7;
      ctx.globalAlpha = (0.10 + 0.10 * P.hold) * (P.down ? 1 : P.hold);
      ctx.drawImage(WHITE, P.x - gs * 0.5, P.y - gs * 0.5, gs, gs);
      ctx.globalAlpha = 1;
    }

    // 暗角
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(vig, 0, 0, W, H);
  }

  /* ---------------------------------------------------------------
     尺寸
     --------------------------------------------------------------- */
  function applyDPR() {
    var d = window.devicePixelRatio || 1;
    dpr = clamp(d, 1, 2) * quality;
    dpr = clamp(dpr, 0.65, 2);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }

  function resize() {
    W = Math.max(1, canvas.clientWidth || window.innerWidth || 1);
    H = Math.max(1, canvas.clientHeight || window.innerHeight || 1);
    unit = clamp(Math.min(W, H) / 420, 0.75, 1.9);
    quality = 1;
    applyDPR();
    buildBG();
    buildVig();
    buildScene();
  }

  var rzTimer = null;
  function onResize() {
    if (rzTimer) { clearTimeout(rzTimer); }
    rzTimer = setTimeout(function () { rzTimer = null; resize(); }, 180);
  }

  /* ---------------------------------------------------------------
     交互（touch + mouse 双通道，兼容所有浏览器）
     --------------------------------------------------------------- */
  function hideHint() {
    if (hintGone) { return; }
    hintGone = true;
    hintEl.style.opacity = '0';
    setTimeout(function () { hintEl.style.display = 'none'; }, 1000);
  }
  setTimeout(hideHint, 9000);

  function pointerDown(x, y) {
    P.down = true;
    P.x = x;
    P.y = y;
    P.vx = 0;
    P.vy = 0;
    P.hold = 0;
    hideHint();
  }

  function pointerMove(x, y) {
    if (!P.down) { return; }
    var dx = x - P.x;
    var dy = y - P.y;
    P.vx = P.vx * 0.45 + dx * 0.55;
    P.vy = P.vy * 0.45 + dy * 0.55;
    P.x = x;
    P.y = y;
  }

  function pointerUp() {
    if (!P.down) { return; }
    P.down = false;
    P.vx = 0;
    P.vy = 0;
  }

  function localPos(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  // --- 触摸 ---
  canvas.addEventListener('touchstart', function (e) {
    usingTouch = true;
    var tch = e.changedTouches[0];
    var p = localPos(tch.clientX, tch.clientY);
    pointerDown(p.x, p.y);
    if (e.preventDefault) { e.preventDefault(); }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    var tch = e.touches[0] || e.changedTouches[0];
    if (!tch) { return; }
    var p = localPos(tch.clientX, tch.clientY);
    pointerMove(p.x, p.y);
    if (e.preventDefault) { e.preventDefault(); }
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    pointerUp();
    if (e.preventDefault) { e.preventDefault(); }
  }, { passive: false });

  canvas.addEventListener('touchcancel', function () {
    pointerUp();
  }, false);

  // iOS 上的橡皮筋滚动彻底封杀
  document.addEventListener('touchmove', function (e) {
    if (e.target === canvas && e.preventDefault) { e.preventDefault(); }
  }, { passive: false });

  // --- 鼠标 ---
  canvas.addEventListener('mousedown', function (e) {
    if (usingTouch) { return; }
    var p = localPos(e.clientX, e.clientY);
    pointerDown(p.x, p.y);
    if (e.preventDefault) { e.preventDefault(); }
  }, false);

  window.addEventListener('mousemove', function (e) {
    if (!P.down || usingTouch) { return; }
    var p = localPos(e.clientX, e.clientY);
    pointerMove(p.x, p.y);
  }, false);

  window.addEventListener('mouseup', function () {
    if (usingTouch) { return; }
    pointerUp();
  }, false);

  // 手势缩放 / 长按菜单
  document.addEventListener('gesturestart', function (e) {
    if (e.preventDefault) { e.preventDefault(); }
  }, false);
  document.addEventListener('contextmenu', function (e) {
    if (e.preventDefault) { e.preventDefault(); }
  }, false);

  // 切后台时松手，回来不会卡住
  window.addEventListener('blur', pointerUp, false);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { pointerUp(); }
  }, false);

  /* ---------------------------------------------------------------
     主循环
     --------------------------------------------------------------- */
  var lastT = 0, accT = 0, frameN = 0;

  function loop(ts) {
    if (!ts) { ts = +new Date(); }
    requestAnimationFrame(loop);

    if (!lastT) { lastT = ts; }
    var dt = (ts - lastT) / 1000;
    lastT = ts;
    if (!(dt > 0)) { dt = 0.016; }
    if (dt > 0.05) { dt = 0.05; }

    var f = dt * 60;
    if (f > 2) { f = 2; }

    try {
      update(dt, f);
      render(ts);
    } catch (err) {
      // 任何异常都不让整个游戏挂掉
      if (window.console && console.error) { console.error(err); }
    }

    // 自适应画质：明显掉帧就降分辨率
    accT += dt;
    frameN++;
    if (frameN >= 50) {
      var avg = accT / frameN;
      if (avg > 0.030 && quality > 0.55) {
        quality *= 0.85;
        applyDPR();
      }
      accT = 0;
      frameN = 0;
    }
  }

  window.addEventListener('resize', onResize, false);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 260);
  }, false);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
